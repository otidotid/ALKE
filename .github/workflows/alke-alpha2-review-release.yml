name: ALKE alpha.2 - Build Test and Publish Review APKs

on:
  push:
    branches:
      - alke/hotfix-brand-dock
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alke-alpha2-release
  cancel-in-progress: true

jobs:
  build-test-release:
    if: github.repository == 'otidotid/ALKE'
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - name: Checkout the exact ALKE hotfix commit
        uses: actions/checkout@v4

      - name: Verify design and backup contract
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/ALKE_ALPHA2_REVIEW.md
          grep -q 'applicationId = "com.otidotid.alke"' android/app/build.gradle.kts
          grep -q 'versionName = "1.0.0-alpha.2"' android/app/build.gradle.kts
          grep -q 'BottomBarModuleStore.selected.map' android/app/src/main/java/com/noop/ui/AppRoot.kt
          grep -q 'Destination.Intelligence)' android/app/src/main/java/com/noop/ui/AppRoot.kt
          grep -q '"alke-backup-"' android/app/src/main/java/com/noop/ui/BackupSync.kt
          grep -q '".alkebak"' android/app/src/main/java/com/noop/ui/BackupSync.kt
          grep -q '<string name="app_name">ALKE</string>' android/app/src/main/res/values/strings.xml
          grep -q '<string name="app_name">ALKE Demo</string>' android/app/src/demo/res/values/strings.xml

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore frozen THOOP parity fixtures only inside runner
        env:
          SOURCE_SHA: de24b55946de9d904f002441e0d24923ef91f2c6
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch v13.2.0 --single-branch \
            https://github.com/otidotid/thoop.git "$RUNNER_TEMP/thoop-v13.2.0"
          test "$(git -C "$RUNNER_TEMP/thoop-v13.2.0" rev-parse HEAD)" = "$SOURCE_SHA"
          for dir in Strand StrandTests StrandiOS; do
            rsync -a "$RUNNER_TEMP/thoop-v13.2.0/$dir/" "$GITHUB_WORKSPACE/$dir/"
          done
          mkdir -p "$GITHUB_WORKSPACE/Tools/parity_cases"
          cp "$RUNNER_TEMP/thoop-v13.2.0/Tools/parity_cases/device_raw_sources.json" \
             "$GITHUB_WORKSPACE/Tools/parity_cases/device_raw_sources.json"

      - name: Build full and separately identified synthetic demo APKs
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleFullDebug :app:assembleDemoDebug

      - name: Run preserved numeric parity and JVM tests
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :app:testFullDebugUnitTest

      - name: Package and integrity-check APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-apks
          mapfile -t full < <(find android/app/build/outputs/apk/full/debug -maxdepth 1 -name '*.apk' -type f)
          mapfile -t demo < <(find android/app/build/outputs/apk/demo/debug -maxdepth 1 -name '*.apk' -type f)
          test "${#full[@]}" -eq 1
          test "${#demo[@]}" -eq 1
          cp "${full[0]}" release-apks/ALKE-v1.0.0-alpha.2-debug.apk
          cp "${demo[0]}" release-apks/ALKE-v1.0.0-alpha.2-demo-debug.apk
          for apk in release-apks/*.apk; do
            test "$(stat -c '%s' "$apk")" -gt 1000000
            unzip -t "$apk" | tail -1
            sha256sum "$apk"
          done

      - name: Upload both review builds to Actions
        uses: actions/upload-artifact@v4
        with:
          name: ALKE-alpha2-review-apks
          path: release-apks/*.apk
          if-no-files-found: error

      - name: Publish alpha.2 GitHub prerelease with two APK assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.0-alpha.2
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to alter the immutable review version."
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          ## ALKE v1.0.0-alpha.2 — Branding, Custom Dock, Heart Rate Timeline

          **Installable debug-signed review builds, not a stable production release.**

          ### User-facing changes
          - ALKE Option 2 deep navy, cyan and gold experience retained.
          - Default dock follows the approved proposal: **Today · Train · Progress · Insight · Me**.
          - **Me > Customize Dock** now controls the real, persistent bottom navigation. Today and Me remain fixed.
          - **Today > Heart Rate Timeline** leads to the preserved time-aligned HR chart, including recorded sport/workout icons and sleep markers. Strain stays a separate training metric.
          - Legacy visible NOOP branding corrected across localized string resources and key UI surfaces, without changing internal settings keys, health algorithms or original source license attribution.
          - **Me > Backup & Restore** makes personal backup import easy to locate.
          - New folder snapshots are named **.alkebak**. Historical **.noopbak** backups remain restorable and excluded from ALKE automatic pruning.

          ### Download the version for your review
          - **ALKE-v1.0.0-alpha.2-debug.apk**: personal-data build; no built-in synthetic health records. Android package `com.otidotid.alke.debug`.
          - **ALKE-v1.0.0-alpha.2-demo-debug.apk**: separately installed **ALKE Demo**, populated with synthetic sample data (not actual measurements). Android package `com.otidotid.alke.demo.debug`.

          ### Important precautions
          - No personal health backups are uploaded to or bundled in GitHub.
          - Restore is local and **replaces the ALKE test app database** after confirmation. Back up current ALKE data before restoring.
          - These APKs may have a different debug-signing certificate from earlier builds. Uninstalling an existing debug ALKE test package deletes that package's local data. Never uninstall THOOP for this preview.
          - The legacy backup container structure is intentionally preserved for compatibility; regular .alkebak local-folder ZIP snapshots are not automatically encrypted. Store them securely.
          - Android device, Bluetooth and actual backup-restore testing are still required before a stable release.

          Built and unit-tested via GitHub Actions for the exact release commit.
          EOF
          gh release create "$TAG" release-apks/*.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "ALKE v1.0.0-alpha.2 — UI Review" \
            --notes-file release-notes.md --prerelease
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,isPrerelease,assets
