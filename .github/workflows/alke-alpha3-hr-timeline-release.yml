name: ALKE alpha.3 - Dedicated HR Timeline Release

on:
  push:
    branches:
      - alke/alpha3-hr-timeline
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alke-alpha3-release
  cancel-in-progress: true

jobs:
  build-test-publish:
    if: github.repository == 'otidotid/ALKE'
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - name: Checkout ALKE source
        uses: actions/checkout@v4

      - name: Check version and dedicated route
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionName = "1.0.0-alpha.3"' android/app/build.gradle.kts
          grep -q 'applicationId = "com.otidotid.alke"' android/app/build.gradle.kts
          grep -q 'AlkeHeartRateTimelineExperience' android/app/src/main/java/com/noop/ui/AlkeExperience.kt
          grep -q 'onHeartRateTimeline = { nav.navigate(Destination.AlkeHeartRateTimeline.route) }' android/app/src/main/java/com/noop/ui/AppRoot.kt
          grep -q 'alkeStyle = true' android/app/src/main/java/com/noop/ui/AlkeExperience.kt
          grep -q 'HeartRateChartShell(alkeStyle)' android/app/src/main/java/com/noop/ui/TodayScreen.kt
          grep -q '<string name="app_name">ALKE</string>' android/app/src/main/res/values/strings.xml
          echo "Dedicated ALKE route and visual gate verified."

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore read-only THOOP numeric-parity fixture sources
        shell: bash
        env:
          SOURCE_SHA: de24b55946de9d904f002441e0d24923ef91f2c6
        run: |
          set -euo pipefail
          git clone --depth=1 --branch v13.2.0 --single-branch \
            https://github.com/otidotid/thoop.git "$RUNNER_TEMP/thoop-v13.2.0"
          test "$(git -C "$RUNNER_TEMP/thoop-v13.2.0" rev-parse HEAD)" = "$SOURCE_SHA"
          for dir in Strand StrandTests StrandiOS; do
            rsync -a "$RUNNER_TEMP/thoop-v13.2.0/$dir/" "$GITHUB_WORKSPACE/$dir/"
          done
          mkdir -p "$GITHUB_WORKSPACE/Tools/parity_cases"
          cp "$RUNNER_TEMP/thoop-v13.2.0/Tools/parity_cases/device_raw_sources.json" \
             "$GITHUB_WORKSPACE/Tools/parity_cases/device_raw_sources.json"

      - name: Compile normal ALKE APK only
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleFullDebug

      - name: Run unit and numeric parity tests
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :app:testFullDebugUnitTest

      - name: Validate and package normal ALKE APK
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find android/app/build/outputs/apk/full/debug -maxdepth 1 -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          mkdir -p release-apk
          cp "${apks[0]}" release-apk/ALKE-v1.0.0-alpha.3-debug.apk
          test "$(stat -c '%s' release-apk/ALKE-v1.0.0-alpha.3-debug.apk)" -gt 1000000
          unzip -t release-apk/ALKE-v1.0.0-alpha.3-debug.apk | tail -1
          sha256sum release-apk/ALKE-v1.0.0-alpha.3-debug.apk

      - name: Keep build artifact as CI evidence
        uses: actions/upload-artifact@v4
        with:
          name: ALKE-alpha3-normal-APK
          path: release-apk/ALKE-v1.0.0-alpha.3-debug.apk
          if-no-files-found: error

      - name: Publish GitHub prerelease with normal APK only
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.0-alpha.3
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release tag $TAG already exists. No overwrite."
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          ## ALKE v1.0.0-alpha.3 — Dedicated Heart Rate Timeline

          **Installable normal ALKE review build, not a stable production release.**

          ### What's changed
          - **Today > Heart Rate Timeline** now opens a dedicated ALKE-designed page, not the inherited full Today dashboard.
          - Consistent deep navy panels, cyan HR line, warm gold accents, readable daily/date navigation and summary metrics.
          - Preserves the existing indexed time-aligned HR graph, recorded workout/sport icons and sleep periods, five-minute HR samples, zoom/pan/scrub, and the same analytics/data queries.
          - Includes links to Live Heart Rate and Workout History.
          - Previous alpha.2 dock customizations, visible ALKE branding and `.alkebak` backup naming remain in place.

          ### APK
          - **ALKE-v1.0.0-alpha.3-debug.apk** — normal build, no synthetic data.
          - Android package: `com.otidotid.alke.debug`.
          - No demo APK is published in this release.
          - Android compilation and full unit/parity test job must pass before this release is published.

          ### Caution
          - Debug-signed review build; validate the visual details and interactions on your phone.
          - The APK signature can differ from previous CI builds. Uninstalling an existing debug package removes its local data; back up anything important first. Do not uninstall THOOP for this review.
          - Backup restore overwrites the app's local database after confirmation; user health backups are not included in the APK, repository or CI.
          - Physical-device Bluetooth and actual personal-backup restore remain separate manual acceptance checks.
          EOF
          gh release create "$TAG" release-apk/ALKE-v1.0.0-alpha.3-debug.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "ALKE v1.0.0-alpha.3 — Heart Rate Timeline" \
            --notes-file release-notes.md --prerelease
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,isPrerelease,assets
