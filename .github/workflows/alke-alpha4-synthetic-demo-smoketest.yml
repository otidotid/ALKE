name: ALKE alpha.4 — Synthetic Data Smoke Test APK

on:
  push:
    branches:
      - alke/alpha4-synthetic-demo
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alke-alpha4-synthetic-demo
  cancel-in-progress: true

jobs:
  build-test-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - name: Checkout ALKE alpha.4 demo branch
        uses: actions/checkout@v4

      - name: Confirm demo-only seeding is enabled
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionName = "1.0.0-alpha.4"' android/app/build.gradle.kts
          grep -q 'buildConfigField("boolean", "ENABLE_DEMO", "true")' android/app/build.gradle.kts
          grep -q 'DemoSeeder.seedIfEmpty' android/app/src/main/java/com/noop/ui/MainActivity.kt
          grep -q 'seedRecentHeartRateIfMissing(repo)' android/app/src/main/java/com/noop/data/DemoSeeder.kt
          grep -q 'repo.insertHr(samples)' android/app/src/main/java/com/noop/data/DemoSeeder.kt
          grep -q '<string name="app_name">ALKE Demo</string>' android/app/src/demo/res/values/strings.xml
          grep -q 'AlkeGlobalHeader(' android/app/src/main/java/com/noop/ui/AppRoot.kt
          grep -q 'AlkeHeartRateTimelineExperience' android/app/src/main/java/com/noop/ui/AlkeExperience.kt
          echo "Demo-only synthetic 120-day metrics and 15-day HR timeline enabled."

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore frozen THOOP numeric-parity reference fixtures
        shell: bash
        env:
          SOURCE_SHA: de24b55946de9d904f002441e0d24923ef91f2c6
        run: |
          set -euo pipefail
          git clone --depth=1 --branch v13.2.0 --single-branch \
            https://github.com/otidotid/thoop.git "$RUNNER_TEMP/thoop-v13.2.0"
          test "$(git -C "$RUNNER_TEMP/thoop-v13.2.0" rev-parse HEAD)" = "$SOURCE_SHA"
          for dir in Strand StrandTests StrandiOS; do
            rsync -a "$RUNNER_TEMP/thoop-v13.2.0/$dir/" "$GITHUB_WORKSPACE/$dir/"
          done
          mkdir -p "$GITHUB_WORKSPACE/Tools/parity_cases"
          cp "$RUNNER_TEMP/thoop-v13.2.0/Tools/parity_cases/device_raw_sources.json" \
            "$GITHUB_WORKSPACE/Tools/parity_cases/device_raw_sources.json"

      - name: Compile ALKE Demo APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDemoDebug

      - name: Full unit and parity tests
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :app:testFullDebugUnitTest

      - name: Verify self-contained demo APK
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find android/app/build/outputs/apk/demo/debug \
            -maxdepth 1 -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          mkdir -p demo-apk
          cp "${apks[0]}" demo-apk/ALKE-v1.0.0-alpha.4-demo-debug.apk
          test "$(stat -c '%s' demo-apk/ALKE-v1.0.0-alpha.4-demo-debug.apk)" -gt 1000000
          unzip -t demo-apk/ALKE-v1.0.0-alpha.4-demo-debug.apk | tail -1
          sha256sum demo-apk/ALKE-v1.0.0-alpha.4-demo-debug.apk

      - name: Store demo APK as artifact ONLY, not GitHub Release
        uses: actions/upload-artifact@v4
        with:
          name: ALKE-alpha4-synthetic-smoketest-APK
          path: demo-apk/ALKE-v1.0.0-alpha.4-demo-debug.apk
          if-no-files-found: error
          retention-days: 14
