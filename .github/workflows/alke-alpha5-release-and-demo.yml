name: ALKE alpha.5 - Normal Release + Synthetic Demo APK

on:
  push:
    branches:
      - alke/alpha5-hr-train-workouts
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alke-alpha5-release
  cancel-in-progress: true

jobs:
  verify-build-publish:
    if: github.repository == 'otidotid/ALKE'
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - name: Checkout exact ALKE alpha.5 source
        uses: actions/checkout@v4

      - name: Guard alpha.5 route, data provenance and separate demo package
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionName = "1.0.0-alpha.5"' android/app/build.gradle.kts
          grep -q 'applicationId = "com.otidotid.alke"' android/app/build.gradle.kts
          grep -q 'AlkeHeartRatePreview(vm, onHeartRateTimeline)' android/app/src/main/java/com/noop/ui/AlkeExperience.kt
          grep -q 'vm.repo.latestHr(activeId)' android/app/src/main/java/com/noop/ui/AlkeExperience.kt
          grep -q 'WorkoutDetailSheet(vm, row)' android/app/src/main/java/com/noop/ui/AlkeExperience.kt
          grep -q 'onHeartRateTimeline = { nav.navigate(Destination.AlkeHeartRateTimeline.route) }' android/app/src/main/java/com/noop/ui/AppRoot.kt
          grep -q 'seedRecentHeartRateIfMissing(repo)' android/app/src/main/java/com/noop/data/DemoSeeder.kt
          grep -q 'class AlkeAlpha5ExperienceContractTest' android/app/src/test/java/com/noop/ui/AlkeAlpha5ExperienceContractTest.kt
          ! grep -q '24-hour HR chart with workout markers and sleep periods' android/app/src/main/java/com/noop/ui/AlkeExperience.kt
          echo 'ALKE alpha.5 route and data guards pass'

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore immutable THOOP parity reference data
        shell: bash
        env:
          SOURCE_SHA: de24b55946de9d904f002441e0d24923ef91f2c6
        run: |
          set -euo pipefail
          git clone --depth=1 --branch v13.2.0 --single-branch \
            https://github.com/otidotid/thoop.git "$RUNNER_TEMP/thoop-v13.2.0"
          test "$(git -C "$RUNNER_TEMP/thoop-v13.2.0" rev-parse HEAD)" = "$SOURCE_SHA"
          for dir in Strand StrandTests StrandiOS; do
            rsync -a "$RUNNER_TEMP/thoop-v13.2.0/$dir/" "$GITHUB_WORKSPACE/$dir/"
          done
          mkdir -p "$GITHUB_WORKSPACE/Tools/parity_cases"
          cp "$RUNNER_TEMP/thoop-v13.2.0/Tools/parity_cases/device_raw_sources.json" \
            "$GITHUB_WORKSPACE/Tools/parity_cases/device_raw_sources.json"

      - name: Build normal and demo APKs from one commit
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleFullDebug :app:assembleDemoDebug

      - name: Run all full-debug unit and numeric parity tests
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :app:testFullDebugUnitTest

      - name: Validate full and demo APK, signing and archive integrity
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t full_apks < <(find android/app/build/outputs/apk/full/debug -maxdepth 1 -type f -name '*.apk')
          mapfile -t demo_apks < <(find android/app/build/outputs/apk/demo/debug -maxdepth 1 -type f -name '*.apk')
          test "${#full_apks[@]}" -eq 1
          test "${#demo_apks[@]}" -eq 1
          mkdir -p release-apk demo-apk
          cp "${full_apks[0]}" release-apk/ALKE-v1.0.0-alpha.5-debug.apk
          cp "${demo_apks[0]}" demo-apk/ALKE-v1.0.0-alpha.5-demo-debug.apk
          for apk in release-apk/*.apk demo-apk/*.apk; do
            test "$(stat -c '%s' "$apk")" -gt 1000000
            unzip -t "$apk" | tail -1
            sha256sum "$apk"
          done
          aapt=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt -type f | sort -V | tail -1)
          test -n "$aapt"
          "$aapt" dump badging release-apk/ALKE-v1.0.0-alpha.5-debug.apk | grep -q "package: name='com.otidotid.alke.debug'"
          "$aapt" dump badging demo-apk/ALKE-v1.0.0-alpha.5-demo-debug.apk | grep -q "package: name='com.otidotid.alke.demo.debug'"
          echo 'Normal and demo Android package IDs verified as distinct.'

      - name: Save normal APK as independent CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALKE-alpha5-normal-APK
          path: release-apk/ALKE-v1.0.0-alpha.5-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Save demo APK as chat-download artifact only
        uses: actions/upload-artifact@v4
        with:
          name: ALKE-alpha5-synthetic-demo-APK
          path: demo-apk/ALKE-v1.0.0-alpha.5-demo-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub prerelease with normal APK only
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.0-alpha.5
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Tag $TAG exists; refusing overwrite."
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          ## ALKE v1.0.0-alpha.5 — HR Today & Workout-Centric Train

          This is the **normal debug review APK**, containing no seeded health data.

          ### Today — real HR, no redundant prose
          - Replaced the long "Heart Rate Timeline" / 24-hour description card with a clean, prominent heart-rate number in BPM.
          - Live BPM is shown only while the wearable is connected and reporting a valid measurement. Otherwise it shows the most recently banked real HR sample and its recorded timestamp; no data shows an honest dash.
          - **Tapping the card still opens the same dedicated Heart Rate Timeline**, preserving 5-minute buckets, workouts/sleep overlays and timeline navigation.

          ### Train — workout-centric premium layout
          - Removed duplicate Live HR and Recovery navigation cards and the "All workouts" heading.
          - Embedded actual multi-source workout sessions with date, duration, avg HR, calories and strain, loading older sessions in place.
          - Each session opens the existing detailed workout sheet. The advanced history/management route and all original data and editing features remain accessible.
          - Existing strain metric and recent-effort chart remain.

          ### Integration and compatibility carried forward
          - ALKE-facing Google and AI messages, ALKE-prefixed optional config with backwards-compatible THOOP keys, and Google Drive archive/backup display names.
          - Preserved all existing internal worker names, database paths, AI provider data, legacy encrypted-backup metadata and numeric scoring algorithms.
          - Physical-device BLE, Google OAuth sign-in and external AI Cloud access still require separate on-device/credential verification.

          ### Builds
          - Asset here: **ALKE-v1.0.0-alpha.5-debug.apk**, Android package `com.otidotid.alke.debug`.
          - A separate demo APK with 120 days synthetic health metrics and 15 days synthetic HR is built and uploaded as a CI artifact, **not** to this release.
          - Both builds and full unit/parity tests must pass before this release is published.
          - APKs are debug signed. Back up data before reinstalling if signing keys differ. Do not uninstall THOOP.
          EOF
          gh release create "$TAG" release-apk/ALKE-v1.0.0-alpha.5-debug.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "ALKE v1.0.0-alpha.5 — Today HR & Train" \
            --notes-file release-notes.md --prerelease
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,isPrerelease,assets
