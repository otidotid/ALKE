name: ALKE Android - Clean Install CI

on:
  push:
    branches:
      - alke/stage-02-brand-foundation
      - alke/stage-03-ui
      - alke/stage-04-modules
  workflow_dispatch:

concurrency:
  group: alke-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout ALKE only
        uses: actions/checkout@v4

      - name: Verify independent package and baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/ALKE_BASELINE.md
          grep -q 'applicationId = "com.otidotid.alke"' android/app/build.gradle.kts
          grep -q '<string name="app_name">ALKE</string>' android/app/src/main/res/values/strings.xml
          echo "ALKE identity and baseline documentation verified."

      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$sdk"
          echo "Android SDK: $sdk"

      - name: Restore read-only cross-platform test references
        shell: bash
        env:
          SOURCE_SHA: de24b55946de9d904f002441e0d24923ef91f2c6
        run: |
          set -euo pipefail
          # Existing Android parity tests read Swift source and shared oracle fixtures.
          # Restore them ONLY in the ephemeral CI workspace, never commit or modify THOOP.
          git clone --depth=1 --branch v13.2.0 --single-branch \
            https://github.com/otidotid/thoop.git "$RUNNER_TEMP/thoop-v13.2.0"
          actual="$(git -C "$RUNNER_TEMP/thoop-v13.2.0" rev-parse HEAD)"
          test "$actual" = "$SOURCE_SHA"
          for dir in Strand StrandTests StrandiOS; do
            rsync -a "$RUNNER_TEMP/thoop-v13.2.0/$dir/" "$GITHUB_WORKSPACE/$dir/"
          done
          # DeviceRawSourceParityTest reads this shared data fixture at runtime.
          # Keep it ephemeral, byte-identical to frozen THOOP; never add it to ALKE's repo.
          mkdir -p "$GITHUB_WORKSPACE/Tools/parity_cases"
          cp "$RUNNER_TEMP/thoop-v13.2.0/Tools/parity_cases/device_raw_sources.json" \
             "$GITHUB_WORKSPACE/Tools/parity_cases/device_raw_sources.json"
          cmp "$RUNNER_TEMP/thoop-v13.2.0/Tools/parity_cases/device_raw_sources.json" \
              "$GITHUB_WORKSPACE/Tools/parity_cases/device_raw_sources.json"

      - name: Compile clean-install APK (no personal data)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleFullDebug

      - name: Upload test-only APK (build success)
        uses: actions/upload-artifact@v4
        with:
          name: ALKE-clean-install-debug
          path: android/app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error

      - name: JVM parity and unit tests
        working-directory: android
        run: |
          ./gradlew --no-daemon --stacktrace :app:testFullDebugUnitTest
