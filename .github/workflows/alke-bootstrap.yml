name: ALKE Stage 1 - Import frozen THOOP baseline

on:
  push:
    branches:
      - alke/stage-01-baseline
    paths:
      - .github/workflows/alke-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alke-stage-01-baseline
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'otidotid/ALKE'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout isolated ALKE branch
        uses: actions/checkout@v4
        with:
          ref: alke/stage-01-baseline
          persist-credentials: true

      - name: Clone immutable THOOP source (read-only)
        shell: bash
        env:
          SOURCE_SHA: de24b55946de9d904f002441e0d24923ef91f2c6
        run: |
          set -euo pipefail
          git clone --depth=1 --branch v13.2.0 --single-branch \
            https://github.com/otidotid/thoop.git "$RUNNER_TEMP/thoop-v13.2.0"
          actual="$(git -C "$RUNNER_TEMP/thoop-v13.2.0" rev-parse HEAD)"
          test "$actual" = "$SOURCE_SHA" || {
            echo "::error::THOOP v13.2.0 source SHA mismatch: $actual"
            exit 1
          }
          echo "Verified frozen source at $actual"

      - name: Import Android and Cloud Coach source into ALKE only
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/thoop-v13.2.0"
          test -f "$source/android/app/build.gradle.kts"
          test -f "$source/LICENSE"
          rsync -a --exclude '.gradle/' --exclude 'build/' \
            "$source/android/" "$GITHUB_WORKSPACE/android/"
          rsync -a "$source/cloud-coach/" "$GITHUB_WORKSPACE/cloud-coach/"
          cp "$source/LICENSE" "$GITHUB_WORKSPACE/LICENSE"
          cp "$source/.gitignore" "$GITHUB_WORKSPACE/.gitignore"
          mkdir -p docs
          cat > docs/ALKE_BASELINE.md <<'DOC'
          # ALKE foundation / source provenance

          - Source: https://github.com/otidotid/thoop
          - Frozen source ref: v13.2.0
          - Frozen source commit: de24b55946de9d904f002441e0d24923ef91f2c6
          - Imported scope: Android app and Cloud Coach backend sources.
          - Isolation: source THOOP repository was cloned read-only; no commits or tags modified there.
          - Licensing: original LICENSE and applicable copyright notices are retained.
          - Stage 1 is source preservation, NOT a finished ALKE app or migration.
          - Stage 2–4: independent Android application ID, approved branding, data-first UI, widgets and progressive disclosure.
          - Stage 5 (later): real encrypted backup restoration and second-phone migration testing.
          - No personal health data, signing secrets or production account credentials are permitted in this repository.
          DOC
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- android cloud-coach LICENSE .gitignore docs/ALKE_BASELINE.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(alke): import frozen v13.2.0 Android baseline"
            git push origin HEAD:alke/stage-01-baseline
          else
            echo "Baseline already imported; no changes"
          fi

      - name: Configure JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Build and run baseline tests (synthetic/local data only)
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:testFullDebugUnitTest :app:assembleFullDebug

      - name: Upload isolated ALKE baseline debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ALKE-stage-1-unbranded-baseline-debug
          path: android/app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
