name: Publish ALKE v605 signed Stage 3 efficiency review

on:
  push:
    branches: [alke/v605-stage3-background-io]
    paths:
      - .github/workflows/alke-v605-publish.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: alke-v605-signed-review-release
  cancel-in-progress: false

jobs:
  publish-v605:
    if: github.repository == 'otidotid/ALKE'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v1.0.0-alpha.22.15-background-efficiency.605
      SOURCE_COMMIT: 90b5128bbf3964292ec39afa9ccba58d7ff1c899
      VALIDATED_RUN: "44982992643"
      VALIDATED_SOURCE_SHA: 90b5128bbf3964292ec39afa9ccba58d7ff1c899
      UNSIGNED_SHA256: a700b0cfca4ed6b93e5b418ddd660d36d4a3a10d87ea6f7d035548a948e9f7a8
      PATCH_SHA256: de115703af9ef529b07691dba674fad5a1489f3a0dead5e8f0649336fce46446
      SIGNED_SHA256: 15904418e0fce22e5ecfee458d7f21cde8f68ee8d9a72ac7185799fc0fc267aa
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify identical tested source and successful Personal quality gate
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SOURCE_COMMIT" HEAD
          git diff --quiet "$SOURCE_COMMIT" HEAD -- android cloud-coach
          test "$(gh run view "$VALIDATED_RUN" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$VALIDATED_RUN" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = "$VALIDATED_SOURCE_SHA"

      - name: Fetch the validated Personal APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v605"
          gh run download "$VALIDATED_RUN" --repo "$GITHUB_REPOSITORY" --name ALKE-Personal-Validated-Unsigned --dir "$RUNNER_TEMP/v605"
          echo "$UNSIGNED_SHA256  $RUNNER_TEMP/v605/ALKE-personal-v605-unsigned.apk" | sha256sum -c -

      - name: Reconstruct independently signed APK from public binary delta
        shell: bash
        run: |
          set -euo pipefail
          cat release-assets/v605-signed.part{0,1,2,3}.b64 | base64 -d |
            python3 -c 'import zlib,sys; sys.stdout.buffer.write(zlib.decompress(sys.stdin.buffer.read()))' > "$RUNNER_TEMP/v605/signed.zstpatch"
          echo "$PATCH_SHA256  $RUNNER_TEMP/v605/signed.zstpatch" | sha256sum -c -
          zstd -q -d --patch-from="$RUNNER_TEMP/v605/ALKE-personal-v605-unsigned.apk" "$RUNNER_TEMP/v605/signed.zstpatch" -o "$RUNNER_TEMP/v605/ALKE-v605-stage3-efficiency-signed.apk"
          echo "$SIGNED_SHA256  $RUNNER_TEMP/v605/ALKE-v605-stage3-efficiency-signed.apk" | sha256sum -c -
          echo "$SIGNED_SHA256  ALKE-v605-stage3-efficiency-signed.apk" > "$RUNNER_TEMP/v605/ALKE-v605-stage3-efficiency-signed.apk.sha256"

      - name: Verify package, version, signatures, and exact v604 Personal certificate
        shell: bash
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/v605/ALKE-v605-stage3-efficiency-signed.apk"
          signer="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt -type f | sort -V | tail -1)"
          test -x "$signer" && test -x "$aapt"
          "$signer" verify --min-sdk-version 26 --verbose --print-certs "$apk" > "$RUNNER_TEMP/v605/signature.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/v605/signature.txt"
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' "$RUNNER_TEMP/v605/signature.txt"
          "$aapt" dump badging "$apk" | head -1 | tee "$RUNNER_TEMP/v605/badging.txt"
          grep -Fq "name='com.otidotid.alke.personal.debug'" "$RUNNER_TEMP/v605/badging.txt"
          grep -Fq "versionCode='605'" "$RUNNER_TEMP/v605/badging.txt"
          mkdir -p "$RUNNER_TEMP/v605/old"
          gh release download v1.0.0-alpha.22.14-stage2-efficiency.604 --repo "$GITHUB_REPOSITORY" --pattern ALKE-v604-stage2-efficiency-signed.apk --dir "$RUNNER_TEMP/v605/old"
          "$signer" verify --min-sdk-version 26 --print-certs "$RUNNER_TEMP/v605/old/ALKE-v604-stage2-efficiency-signed.apk" > "$RUNNER_TEMP/v605/v604-cert.txt"
          old_cert="$(sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/v605/v604-cert.txt" | head -1)"
          new_cert="$(sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/v605/signature.txt" | head -1)"
          test -n "$old_cert" && test "$old_cert" = "$new_cert"
          test "$new_cert" = "f34c6210ef774d588a426a784a09bb452f01b6c5f18bec64b03e209a0420e877"

      - name: Publish signed prerelease for owner smoke testing
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/v605/RELEASE_NOTES.md" <<'NOTES'
          # ALKE v605 — Stage 3 Background & Analytics Efficiency

          **Signed Personal APK** for in-place updates over v604. Do not uninstall or clear ALKE data.

          - Serializes heavy compact history snapshots, full Drive backup, and verified encrypted archive workloads to reduce background disk and upload contention.
          - Uses indexed seven-day windows instead of repeated historical scans for Fitness Age / Vitality weekly backfill, preserving day inputs, order and scoring formulas.
          - Keeps Saturday-only Fitness Age publication; manual weekday recompute no longer falsely reports a persisted score.
          - Extends BLE lossless FIFO regression testing to 50,001 synthetic frames (not physical strap evidence).
          - Preserves original health/food history, current algorithm scores, backup schedules, Google Drive encryption and all existing Room tables.

          Full Personal quality gate successful (run 44982992643, commit 90b5128).
          Original Personal signing certificate verified against v604; APK Signature v2/v3 verified.
          Signed APK SHA-256: 15904418e0fce22e5ecfee458d7f21cde8f68ee8d9a72ac7185799fc0fc267aa.

          **Review limitation:** real WHOOP backlog, sync disconnect/reconnect, fitness score parity on physical data, battery and thermals are not independently verified by CI. This is a signed prerelease for owner smoke testing; PR #8 remains draft until owner validation.
          NOTES
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/v605/ALKE-v605-stage3-efficiency-signed.apk" "$RUNNER_TEMP/v605/ALKE-v605-stage3-efficiency-signed.apk.sha256" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title 'ALKE Alpha 22.15 v605 — Stage 3 Background Efficiency Signed Review' --notes-file "$RUNNER_TEMP/v605/RELEASE_NOTES.md" --prerelease
          else
            gh release create "$RELEASE_TAG" "$RUNNER_TEMP/v605/ALKE-v605-stage3-efficiency-signed.apk" "$RUNNER_TEMP/v605/ALKE-v605-stage3-efficiency-signed.apk.sha256" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_COMMIT" --title 'ALKE Alpha 22.15 v605 — Stage 3 Background Efficiency Signed Review' --notes-file "$RUNNER_TEMP/v605/RELEASE_NOTES.md" --prerelease
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,url,assets --jq '{tag:.tagName,url:.url,assets:[.assets[].name]}'
