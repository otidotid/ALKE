name: Publish ALKE v607 signed Smart Daily Snapshot review

on:
  push:
    branches: [alke/v607-smart-daily-snapshots]
    paths:
      - .github/workflows/alke-v607-publish.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: alke-v607-snapshot-signed-review-release
  cancel-in-progress: false

jobs:
  publish-v607:
    if: github.repository == 'otidotid/ALKE'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v1.0.0-alpha.22.17-smart-daily-snapshot.607
      SOURCE_COMMIT: 87bf89d92dbcce8d2322391e4b816d8e993bac38
      VALIDATED_RUN: '44989166476'
      VALIDATED_SOURCE_SHA: 87bf89d92dbcce8d2322391e4b816d8e993bac38
      UNSIGNED_SHA256: 7b6666e497c9daed9a736c423d3a47fa99d6048d1669ae1e1d20c10ebe3edc7a
      PATCH_SHA256: 19e65b7f8a8f4c0aebfe9343dbfdbcc9b1de300037ab3ee1ccd2da318db28315
      SIGNED_SHA256: 8de72fc1aa1647fc677da9964fb9f2a0fac4fa064ed86bebb649459c48214b84
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact tested source and complete Personal quality gate
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SOURCE_COMMIT" HEAD
          git diff --quiet "$SOURCE_COMMIT" HEAD -- android cloud-coach
          test "$(gh run view "$VALIDATED_RUN" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$VALIDATED_RUN" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = "$VALIDATED_SOURCE_SHA"

      - name: Download validated unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v607"
          gh run download "$VALIDATED_RUN" --repo "$GITHUB_REPOSITORY" --name ALKE-Personal-Validated-Unsigned --dir "$RUNNER_TEMP/v607"
          echo "$UNSIGNED_SHA256  $RUNNER_TEMP/v607/ALKE-personal-v607-unsigned.apk" | sha256sum -c -

      - name: Reconstruct privately signed APK using public binary delta
        shell: bash
        run: |
          set -euo pipefail
          base64 -d release-assets/v607-signed.zlib.b64 |
            python3 -c 'import zlib,sys; sys.stdout.buffer.write(zlib.decompress(sys.stdin.buffer.read()))' > "$RUNNER_TEMP/v607/signed.zstpatch"
          echo "$PATCH_SHA256  $RUNNER_TEMP/v607/signed.zstpatch" | sha256sum -c -
          zstd -q -d --patch-from="$RUNNER_TEMP/v607/ALKE-personal-v607-unsigned.apk" "$RUNNER_TEMP/v607/signed.zstpatch" -o "$RUNNER_TEMP/v607/ALKE-v607-smart-daily-snapshot-signed.apk"
          echo "$SIGNED_SHA256  $RUNNER_TEMP/v607/ALKE-v607-smart-daily-snapshot-signed.apk" | sha256sum -c -
          echo "$SIGNED_SHA256  ALKE-v607-smart-daily-snapshot-signed.apk" > "$RUNNER_TEMP/v607/ALKE-v607-smart-daily-snapshot-signed.apk.sha256"

      - name: Verify package, version and ALKE Personal update certificate
        shell: bash
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/v607/ALKE-v607-smart-daily-snapshot-signed.apk"
          signer="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt -type f | sort -V | tail -1)"
          test -x "$signer" && test -x "$aapt"
          "$signer" verify --min-sdk-version 26 --verbose --print-certs "$apk" > "$RUNNER_TEMP/v607/signature.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/v607/signature.txt"
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' "$RUNNER_TEMP/v607/signature.txt"
          "$aapt" dump badging "$apk" | head -1 | tee "$RUNNER_TEMP/v607/badging.txt"
          grep -Fq "name='com.otidotid.alke.personal.debug'" "$RUNNER_TEMP/v607/badging.txt"
          grep -Fq "versionCode='607'" "$RUNNER_TEMP/v607/badging.txt"
          mkdir -p "$RUNNER_TEMP/v607/previous"
          gh release download v1.0.0-alpha.22.16-me-cloud-read-cache.606 --repo "$GITHUB_REPOSITORY" --pattern ALKE-v606-me-history-cache-signed.apk --dir "$RUNNER_TEMP/v607/previous"
          "$signer" verify --min-sdk-version 26 --print-certs "$RUNNER_TEMP/v607/previous/ALKE-v606-me-history-cache-signed.apk" > "$RUNNER_TEMP/v607/v606-cert.txt"
          old_cert="$(sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/v607/v606-cert.txt" | head -1)"
          new_cert="$(sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/v607/signature.txt" | head -1)"
          test -n "$old_cert" && test "$old_cert" = "$new_cert"
          test "$new_cert" = "f34c6210ef774d588a426a784a09bb452f01b6c5f18bec64b03e209a0420e877"

      - name: Publish GitHub signed prerelease for owner smoke testing
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/v607/RELEASE_NOTES.md" <<'NOTES'
          # ALKE v607 — Smart Daily Snapshot and consistent Effort displays

          Signed Personal APK for direct update over v606. Do not uninstall ALKE or clear app data.

          - Optional compressed and CRC-protected DailyMetric snapshot is generated from the authoritative merged history; all nullable fields and values are preserved. No changes to scoring or raw history.
          - Trends and Explore can render cached full history before the database refresh. The database always remains authoritative; existing reactive recent days still apply.
          - Automatic snapshot worker refreshes presentation cache without interfering with existing compact 15–21-day snapshots, encrypted Drive archives, or backup scheduling.
          - All visible Effort readouts are now whole points (no decimal comma or period), including 0–100 and 0–21 display scales, Today, Me, Train, Live Workout, Trends, Explore and PDF metrics. Stored decimals and score calculations stay unchanged.
          - Full Personal tests succeeded on source commit 87bf89d92dbcce8d2322391e4b816d8e993bac38 (Actions run 44989166476). APK Signature v2/v3 and original ALKE update certificate verified against v606.
          - Signed APK SHA-256: 8de72fc1aa1647fc677da9964fb9f2a0fac4fa064ed86bebb649459c48214b84.

          For owner smoke test: update in place, check Today/Train/Trends Effort formatting, 7-day / 30-day / All charts and old imported history, sync and archived history. No deletion or cloud-format changes; PR #10 stays draft until user verification.
          NOTES
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/v607/ALKE-v607-smart-daily-snapshot-signed.apk" "$RUNNER_TEMP/v607/ALKE-v607-smart-daily-snapshot-signed.apk.sha256" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title 'ALKE Alpha 22.17 v607 — Smart Daily Snapshot & Effort Signed Review' --notes-file "$RUNNER_TEMP/v607/RELEASE_NOTES.md" --prerelease
          else
            gh release create "$RELEASE_TAG" "$RUNNER_TEMP/v607/ALKE-v607-smart-daily-snapshot-signed.apk" "$RUNNER_TEMP/v607/ALKE-v607-smart-daily-snapshot-signed.apk.sha256" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_COMMIT" --title 'ALKE Alpha 22.17 v607 — Smart Daily Snapshot & Effort Signed Review' --notes-file "$RUNNER_TEMP/v607/RELEASE_NOTES.md" --prerelease
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,url,assets --jq '{tag:.tagName,url:.url,assets:[.assets[].name]}'