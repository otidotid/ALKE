name: Publish ALKE v611 original Personal signed Patch 15 review

on:
  push:
    branches: [alke/v611-verified-offload-parity-gates]
    paths:
      - .github/workflows/alke-v611-personal-publish.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: alke-v611-original-personal-signed-release
  cancel-in-progress: false

jobs:
  publish-v611:
    if: github.repository == 'otidotid/ALKE'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v1.0.0-alpha.22.21-verified-offload-safety.611
      SOURCE_COMMIT: 0e32d239e8775e29dbfb999d9d4983f63c785f93
      VALIDATED_RUN: '44998234455'
      VALIDATED_SOURCE_SHA: 0e32d239e8775e29dbfb999d9d4983f63c785f93
      UNSIGNED_SHA256: 3fba906ea892b8b5644ed4f821f58301b6de13b637c8699cd8ad429c2bcf0176
      PATCH_SHA256: 1a49f38bea35fde32e449abac608f20fb12c5e53b8c1b1b481fd1f3eecee32b1
      SIGNED_SHA256: 69aee97d6929de0a25ec316842fa5a60b69af253e7daf43dc47441a6c2b80116

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact tested source and full Personal quality gate
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SOURCE_COMMIT" HEAD
          git diff --quiet "$SOURCE_COMMIT" HEAD -- android cloud-coach
          grep -Fq 'versionCode = 611' android/app/build.gradle.kts
          test "$(gh run view "$VALIDATED_RUN" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$VALIDATED_RUN" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = "$VALIDATED_SOURCE_SHA"

      - name: Download precisely validated v611 Personal APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v611"
          gh run download "$VALIDATED_RUN" --repo "$GITHUB_REPOSITORY" --name ALKE-Personal-Validated-Unsigned --dir "$RUNNER_TEMP/v611"
          echo "$UNSIGNED_SHA256  $RUNNER_TEMP/v611/ALKE-personal-v611-unsigned.apk" | sha256sum -c -

      - name: Reconstruct privately signed APK without ever hosting the keystore
        shell: bash
        run: |
          set -euo pipefail
          base64 -d release-assets/v611-signed.zlib.b64 |
            python3 -c 'import zlib,sys;sys.stdout.buffer.write(zlib.decompress(sys.stdin.buffer.read()))' > "$RUNNER_TEMP/v611/signed.zstpatch"
          echo "$PATCH_SHA256  $RUNNER_TEMP/v611/signed.zstpatch" | sha256sum -c -
          zstd -q -d --patch-from="$RUNNER_TEMP/v611/ALKE-personal-v611-unsigned.apk" "$RUNNER_TEMP/v611/signed.zstpatch" -o "$RUNNER_TEMP/v611/ALKE-v611-patch15-personal-signed.apk"
          echo "$SIGNED_SHA256  $RUNNER_TEMP/v611/ALKE-v611-patch15-personal-signed.apk" | sha256sum -c -
          echo "$SIGNED_SHA256  ALKE-v611-patch15-personal-signed.apk" > "$RUNNER_TEMP/v611/ALKE-v611-patch15-personal-signed.apk.sha256"

      - name: Validate original v610 compatible signer, app package and build number
        shell: bash
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/v611/ALKE-v611-patch15-personal-signed.apk"
          signer="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          test -x "$signer" && test -x "$aapt"
          "$signer" verify --min-sdk-version 26 --verbose --print-certs "$apk" > "$RUNNER_TEMP/v611/signature.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/v611/signature.txt"
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' "$RUNNER_TEMP/v611/signature.txt"
          grep -Fq 'certificate SHA-256 digest: f34c6210ef774d588a426a784a09bb452f01b6c5f18bec64b03e209a0420e877' "$RUNNER_TEMP/v611/signature.txt"
          "$aapt" dump badging "$apk" | head -1 | tee "$RUNNER_TEMP/v611/badging.txt"
          grep -Fq "name='com.otidotid.alke.personal.debug'" "$RUNNER_TEMP/v611/badging.txt"
          grep -Fq "versionCode='611'" "$RUNNER_TEMP/v611/badging.txt"
          unzip -t "$apk" >/dev/null
          mkdir -p "$RUNNER_TEMP/v611/previous"
          gh release download v1.0.0-alpha.22.20-cache-online-readiness.610 --repo "$GITHUB_REPOSITORY" --pattern ALKE-v610-cache-online-readiness-signed.apk --dir "$RUNNER_TEMP/v611/previous"
          "$signer" verify --min-sdk-version 26 --print-certs "$RUNNER_TEMP/v611/previous/ALKE-v610-cache-online-readiness-signed.apk" > "$RUNNER_TEMP/v611/previous-cert.txt"
          previous_cert="$(sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/v611/previous-cert.txt" | head -1)"
          new_cert="$(sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/v611/signature.txt" | head -1)"
          test -n "$previous_cert" && test "$new_cert" = "$previous_cert"

      - name: Publish signed ALKE v611 GitHub prerelease for owner review
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/v611/RELEASE_NOTES.md" <<'NOTES'
          # ALKE v611 — Patch 15 verified offload safety review
          
          **Signed with the original ALKE Personal update certificate, same as v610.**
          Install directly over v610. **Do not uninstall or clear data.**
          
          - New fail-closed offload-readiness gate rejects missing month coverage,
            duplicate/future archives, expired proof and changed archive revisions.
          - Requires complete encrypted HEALTH + FOOD backup read-back, independent
            isolated restore, scoring and cross-module parity, all source devices,
            and rollback including interrupted offload before even considering cleanup.
          - Important: **destructive online-only migration is NOT implemented or
            enabled in this review. No local health or food history is deleted.**
          - Existing v610 weekly ciphertext cache, prefetch, original backup format,
            Google Drive functions and health scoring logic are retained.
          - Full Android Personal quality gate: run 44998234455,
            source 0e32d239e8775e29dbfb999d9d4983f63c785f93.
          - Signed APK SHA-256:
            69aee97d6929de0a25ec316842fa5a60b69af253e7daf43dc47441a6c2b80116.
          
          Review after updating: launch ALKE, check Today/Sleep/Train/Insights/Food
          and existing old cloud history. Local records must remain untouched.
          Further storage offload work remains protected behind recovery parity gates.
          NOTES
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/v611/ALKE-v611-patch15-personal-signed.apk" "$RUNNER_TEMP/v611/ALKE-v611-patch15-personal-signed.apk.sha256" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "ALKE Alpha 22.21 v611 — Patch 15 Signed Safety Review" --notes-file "$RUNNER_TEMP/v611/RELEASE_NOTES.md" --prerelease
          else
            gh release create "$RELEASE_TAG" "$RUNNER_TEMP/v611/ALKE-v611-patch15-personal-signed.apk" "$RUNNER_TEMP/v611/ALKE-v611-patch15-personal-signed.apk.sha256" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_COMMIT" --title "ALKE Alpha 22.21 v611 — Patch 15 Signed Safety Review" --notes-file "$RUNNER_TEMP/v611/RELEASE_NOTES.md" --prerelease
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,url,assets --jq '{tag:.tagName,url:.url,assets:[.assets[].name]}'
