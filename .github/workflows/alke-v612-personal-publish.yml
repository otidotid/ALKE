name: Publish ALKE v612 original Personal signed Complete Device Migration

on:
  push:
    branches: [alke/v612-complete-device-migration]
    paths:
      - .github/workflows/alke-v612-personal-publish.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: alke-v612-original-personal-signed-release
  cancel-in-progress: false

jobs:
  publish-v612:
    if: github.repository == 'otidotid/ALKE'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v1.0.0-alpha.22.22-complete-device-migration.612
      SOURCE_COMMIT: b09fe143b55b9b55e8fb00a53e3caab9ac15a870
      VALIDATED_RUN: '45000682687'
      VALIDATED_SOURCE_SHA: b09fe143b55b9b55e8fb00a53e3caab9ac15a870
      UNSIGNED_SHA256: 79f85af05353843ca7ecfd1943716b09b958780a2773d5a1e4defac4734b4f70
      PATCH_SHA256: d8c22e2641ef2825c58bd6e47b503840aaaae360b270b91dc31bec08b32839d6
      SIGNED_SHA256: 871b09bb2e786472ce1f5bfba688ce8b4ace821a9ef7e576f28cdb5ae8c6f6d0

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact tested source and full Personal quality gate
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SOURCE_COMMIT" HEAD
          git diff --quiet "$SOURCE_COMMIT" HEAD -- android cloud-coach
          grep -Fq 'versionCode = 612' android/app/build.gradle.kts
          test "$(gh run view "$VALIDATED_RUN" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$VALIDATED_RUN" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = "$VALIDATED_SOURCE_SHA"

      - name: Download precisely validated v611 Personal APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v612"
          gh run download "$VALIDATED_RUN" --repo "$GITHUB_REPOSITORY" --name ALKE-Personal-Validated-Unsigned --dir "$RUNNER_TEMP/v612"
          echo "$UNSIGNED_SHA256  $RUNNER_TEMP/v612/ALKE-personal-v612-unsigned.apk" | sha256sum -c -

      - name: Reconstruct privately signed APK without ever hosting the keystore
        shell: bash
        run: |
          set -euo pipefail
          base64 -d release-assets/v612-signed.zlib.b64 |
            python3 -c 'import zlib,sys;sys.stdout.buffer.write(zlib.decompress(sys.stdin.buffer.read()))' > "$RUNNER_TEMP/v612/signed.zstpatch"
          echo "$PATCH_SHA256  $RUNNER_TEMP/v612/signed.zstpatch" | sha256sum -c -
          zstd -q -d --patch-from="$RUNNER_TEMP/v612/ALKE-personal-v612-unsigned.apk" "$RUNNER_TEMP/v612/signed.zstpatch" -o "$RUNNER_TEMP/v612/ALKE-v612-complete-device-migration-personal-signed.apk"
          echo "$SIGNED_SHA256  $RUNNER_TEMP/v612/ALKE-v612-complete-device-migration-personal-signed.apk" | sha256sum -c -
          echo "$SIGNED_SHA256  ALKE-v612-complete-device-migration-personal-signed.apk" > "$RUNNER_TEMP/v612/ALKE-v612-complete-device-migration-personal-signed.apk.sha256"

      - name: Validate original v611 compatible signer, app package and build number
        shell: bash
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/v612/ALKE-v612-complete-device-migration-personal-signed.apk"
          signer="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          test -x "$signer" && test -x "$aapt"
          "$signer" verify --min-sdk-version 26 --verbose --print-certs "$apk" > "$RUNNER_TEMP/v612/signature.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/v612/signature.txt"
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' "$RUNNER_TEMP/v612/signature.txt"
          grep -Fq 'certificate SHA-256 digest: f34c6210ef774d588a426a784a09bb452f01b6c5f18bec64b03e209a0420e877' "$RUNNER_TEMP/v612/signature.txt"
          "$aapt" dump badging "$apk" | head -1 | tee "$RUNNER_TEMP/v612/badging.txt"
          grep -Fq "name='com.otidotid.alke.personal.debug'" "$RUNNER_TEMP/v612/badging.txt"
          grep -Fq "versionCode='612'" "$RUNNER_TEMP/v612/badging.txt"
          unzip -t "$apk" >/dev/null
          mkdir -p "$RUNNER_TEMP/v612/previous"
          gh release download v1.0.0-alpha.22.21-verified-offload-safety.611 --repo "$GITHUB_REPOSITORY" --pattern ALKE-v611-patch15-personal-signed.apk --dir "$RUNNER_TEMP/v612/previous"
          "$signer" verify --min-sdk-version 26 --print-certs "$RUNNER_TEMP/v612/previous/ALKE-v611-patch15-personal-signed.apk" > "$RUNNER_TEMP/v612/previous-cert.txt"
          previous_cert="$(sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/v612/previous-cert.txt" | head -1)"
          new_cert="$(sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/v612/signature.txt" | head -1)"
          test -n "$previous_cert" && test "$new_cert" = "$previous_cert"

      - name: Publish signed ALKE v612 GitHub prerelease for owner review
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/v612/RELEASE_NOTES.md" <<'NOTES'
          # ALKE v612 — Complete Device Migration (Personal signed)
          
          **Signed with the original ALKE Personal certificate, compatible with v611.**
          Update directly over v611; DO NOT uninstall, clear data or reset storage.
          
          - Encrypted full-backup improvements: profile avatar, full birth date, Today and Sleep layouts,
            pinned bottom navigation, appearance, alarms, haptics, notifications and personal choices.
          - HEALTH and FOOD database full-backup integrity gates and recovery passphrase remain intact.
          - Google OAuth tokens, BLE pairing, Android permissions, runtime sync cursors and wearable calibration
            are deliberately excluded and may require setup on a new phone.
          - Known limitation: custom-background photo files are not included; WHOOP 4 manual steps coefficient
            can lose precedence to auto-fit. No steps algorithm changes were made in v612.
          - Full new-device encrypted restore parity has not yet been smoke-tested; keep an old-device backup.
          - Destructive online-only history offload remains disabled. No local health/food history is deleted.
          
          Personal quality gate SUCCESS: 45000682687 (SHA b09fe143b55b9b55e8fb00a53e3caab9ac15a870).
          Signed APK SHA256: 871b09bb2e786472ce1f5bfba688ce8b4ace821a9ef7e576f28cdb5ae8c6f6d0.
          NOTES
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/v612/ALKE-v612-complete-device-migration-personal-signed.apk" "$RUNNER_TEMP/v612/ALKE-v612-complete-device-migration-personal-signed.apk.sha256" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "ALKE Alpha 22.22 v612 — Signed Complete Device Migration" --notes-file "$RUNNER_TEMP/v612/RELEASE_NOTES.md" --prerelease
          else
            gh release create "$RELEASE_TAG" "$RUNNER_TEMP/v612/ALKE-v612-complete-device-migration-personal-signed.apk" "$RUNNER_TEMP/v612/ALKE-v612-complete-device-migration-personal-signed.apk.sha256" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_COMMIT" --title "ALKE Alpha 22.22 v612 — Signed Complete Device Migration" --notes-file "$RUNNER_TEMP/v612/RELEASE_NOTES.md" --prerelease
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,url,assets --jq '{tag:.tagName,url:.url,assets:[.assets[].name]}'
