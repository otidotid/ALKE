name: Publish ALKE v613 original Personal signed Premium Live Widgets

on:
  push:
    branches: [alke/v613-widget-premium-live-hr]
    paths:
      - .github/workflows/alke-v613-personal-publish.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: alke-v613-original-personal-signed-release
  cancel-in-progress: false

jobs:
  publish-v613:
    if: github.repository == 'otidotid/ALKE'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v1.0.0-alpha.22.23-premium-live-widgets.613
      SOURCE_COMMIT: b47107cab04a09e7f0f3a1d91a5d05301ad2317a
      VALIDATED_RUN: '45017942837'
      VALIDATED_SOURCE_SHA: b47107cab04a09e7f0f3a1d91a5d05301ad2317a
      UNSIGNED_SHA256: b07ce5afef6343f682e26e9b2e3b37b3eba9d4661e6e9132f8e243bd2e6ec06b
      PATCH_SHA256: 4e3fb88e7c06b8a4d9b95a5910772a7511a454a4ae23c49e37dd4ee3ff3d5ea9
      SIGNED_SHA256: 516b639934475ce6f8bd559b90ce326f00e4ebd6a2d02a335eca253764fc8dae

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact tested source and full Personal quality gate
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SOURCE_COMMIT" HEAD
          git diff --quiet "$SOURCE_COMMIT" HEAD -- android cloud-coach
          grep -Fq 'versionCode = 613' android/app/build.gradle.kts
          test "$(gh run view "$VALIDATED_RUN" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$VALIDATED_RUN" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = "$VALIDATED_SOURCE_SHA"

      - name: Download precisely validated v613 Personal APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v613"
          gh run download "$VALIDATED_RUN" --repo "$GITHUB_REPOSITORY" --name ALKE-Personal-Validated-Unsigned --dir "$RUNNER_TEMP/v613"
          echo "$UNSIGNED_SHA256  $RUNNER_TEMP/v613/ALKE-personal-v613-unsigned.apk" | sha256sum -c -

      - name: Reconstruct privately signed APK without ever hosting the keystore
        shell: bash
        run: |
          set -euo pipefail
          cat release-assets/v613-signed-part-{01..06}.b64 | base64 -d |
            python3 -c 'import zlib,sys;sys.stdout.buffer.write(zlib.decompress(sys.stdin.buffer.read()))' > "$RUNNER_TEMP/v613/signed.zstpatch"
          echo "$PATCH_SHA256  $RUNNER_TEMP/v613/signed.zstpatch" | sha256sum -c -
          zstd -q -d --patch-from="$RUNNER_TEMP/v613/ALKE-personal-v613-unsigned.apk" "$RUNNER_TEMP/v613/signed.zstpatch" -o "$RUNNER_TEMP/v613/ALKE-v613-premium-live-widgets-personal-signed.apk"
          echo "$SIGNED_SHA256  $RUNNER_TEMP/v613/ALKE-v613-premium-live-widgets-personal-signed.apk" | sha256sum -c -
          echo "$SIGNED_SHA256  ALKE-v613-premium-live-widgets-personal-signed.apk" > "$RUNNER_TEMP/v613/ALKE-v613-premium-live-widgets-personal-signed.apk.sha256"

      - name: Validate original v612 compatible signer, app package and build number
        shell: bash
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/v613/ALKE-v613-premium-live-widgets-personal-signed.apk"
          signer="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          test -x "$signer" && test -x "$aapt"
          "$signer" verify --min-sdk-version 26 --verbose --print-certs "$apk" > "$RUNNER_TEMP/v613/signature.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/v613/signature.txt"
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' "$RUNNER_TEMP/v613/signature.txt"
          grep -Fq 'certificate SHA-256 digest: f34c6210ef774d588a426a784a09bb452f01b6c5f18bec64b03e209a0420e877' "$RUNNER_TEMP/v613/signature.txt"
          "$aapt" dump badging "$apk" | head -1 | tee "$RUNNER_TEMP/v613/badging.txt"
          grep -Fq "name='com.otidotid.alke.personal.debug'" "$RUNNER_TEMP/v613/badging.txt"
          grep -Fq "versionCode='613'" "$RUNNER_TEMP/v613/badging.txt"
          unzip -t "$apk" >/dev/null
          mkdir -p "$RUNNER_TEMP/v613/previous"
          gh release download v1.0.0-alpha.22.22-complete-device-migration.612 --repo "$GITHUB_REPOSITORY" --pattern ALKE-v612-complete-device-migration-personal-signed.apk --dir "$RUNNER_TEMP/v613/previous"
          "$signer" verify --min-sdk-version 26 --print-certs "$RUNNER_TEMP/v613/previous/ALKE-v612-complete-device-migration-personal-signed.apk" > "$RUNNER_TEMP/v613/previous-cert.txt"
          previous_cert="$(sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/v613/previous-cert.txt" | head -1)"
          new_cert="$(sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/v613/signature.txt" | head -1)"
          test -n "$previous_cert" && test "$new_cert" = "$previous_cert"

      - name: Publish signed ALKE v613 GitHub prerelease for owner review
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/v613/RELEASE_NOTES.md" <<'NOTES'
          # ALKE v613 — Premium Live Widgets (Personal signed)
          
          **Compatible with v612's original Personal update certificate.**
          Install directly over v612. DO NOT uninstall, clear data or reset storage.
          
          - HR home-screen widget: low-latency BLE update path, no 60-second snapshot gate;
            actual source freshness and direct tap-through to Heart Rate Timeline.
          - Compact 2x2: vector icons for Charge, Rest, Effort, HR plus segmented wearable battery gauge.
          - Daily 3x2: Charge/Rest/Effort visual triptych, fresh/recorded HR status and battery gauge.
          - No changes to sync, sensor/score algorithms, backups, historical data or cloud processing.
          - HR updates in the background require an active BLE connection/foreground service;
            they are not guaranteed when Android terminates the process.
          - Launcher smoke test for rendering and cold/warm navigation still required.
          - Existing limitation: custom user-picked background files are not in v612 backup migration.
          
          Personal CI SUCCESS run 45017942837, source commit b47107cab04a09e7f0f3a1d91a5d05301ad2317a.
          Signed APK SHA256: 516b639934475ce6f8bd559b90ce326f00e4ebd6a2d02a335eca253764fc8dae.
          NOTES
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/v613/ALKE-v613-premium-live-widgets-personal-signed.apk" "$RUNNER_TEMP/v613/ALKE-v613-premium-live-widgets-personal-signed.apk.sha256" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "ALKE Alpha 22.23 v613 — Premium Live Widgets (Personal Signed)" --notes-file "$RUNNER_TEMP/v613/RELEASE_NOTES.md" --prerelease
          else
            gh release create "$RELEASE_TAG" "$RUNNER_TEMP/v613/ALKE-v613-premium-live-widgets-personal-signed.apk" "$RUNNER_TEMP/v613/ALKE-v613-premium-live-widgets-personal-signed.apk.sha256" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_COMMIT" --title "ALKE Alpha 22.23 v613 — Premium Live Widgets (Personal Signed)" --notes-file "$RUNNER_TEMP/v613/RELEASE_NOTES.md" --prerelease
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,url,assets --jq '{tag:.tagName,url:.url,assets:[.assets[].name]}'
