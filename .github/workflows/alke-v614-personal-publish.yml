name: Publish ALKE v614 original Personal signed HR Widget Recovery

on:
  push:
    branches: [alke/v614-hr-widget-recovery]
    paths:
      - .github/workflows/alke-v614-personal-publish.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: alke-v614-original-personal-signed-release
  cancel-in-progress: false

jobs:
  publish-v614:
    if: github.repository == 'otidotid/ALKE'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v1.0.0-alpha.22.24-hr-widget-recovery.614
      SOURCE_COMMIT: 86c287daf73dd0fbbca54843b5224ea5b4a9bcf3
      VALIDATED_RUN: '45020175520'
      VALIDATED_SOURCE_SHA: 86c287daf73dd0fbbca54843b5224ea5b4a9bcf3
      UNSIGNED_SHA256: a8444385d7c273f606652242b54d497bc797e2aeca65fd9aff0028f5f72507a7
      PATCH_SHA256: b223c9538bc2d0326cbfc4cea879d33f06032413787bfc03dfbc69148573c47c
      SIGNED_SHA256: dc874fbf8405e9c7a505cb4f14012c4c06389471696135e8a1f3ca39aa6c4302

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact tested source and full Personal quality gate
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SOURCE_COMMIT" HEAD
          git diff --quiet "$SOURCE_COMMIT" HEAD -- android cloud-coach
          grep -Fq 'versionCode = 614' android/app/build.gradle.kts
          test "$(gh run view "$VALIDATED_RUN" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$VALIDATED_RUN" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = "$VALIDATED_SOURCE_SHA"

      - name: Download precisely validated v614 Personal APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v614"
          gh run download "$VALIDATED_RUN" --repo "$GITHUB_REPOSITORY" --name ALKE-Personal-Validated-Unsigned --dir "$RUNNER_TEMP/v614"
          echo "$UNSIGNED_SHA256  $RUNNER_TEMP/v614/ALKE-personal-v614-unsigned.apk" | sha256sum -c -

      - name: Reconstruct privately signed APK without ever hosting the keystore
        shell: bash
        run: |
          set -euo pipefail
          cat release-assets/v614-signed-part-{01..06}.b64 | base64 -d |
            python3 -c 'import zlib,sys;sys.stdout.buffer.write(zlib.decompress(sys.stdin.buffer.read()))' > "$RUNNER_TEMP/v614/signed.zstpatch"
          echo "$PATCH_SHA256  $RUNNER_TEMP/v614/signed.zstpatch" | sha256sum -c -
          zstd -q -d --patch-from="$RUNNER_TEMP/v614/ALKE-personal-v614-unsigned.apk" "$RUNNER_TEMP/v614/signed.zstpatch" -o "$RUNNER_TEMP/v614/ALKE-v614-hr-widget-recovery-personal-signed.apk"
          echo "$SIGNED_SHA256  $RUNNER_TEMP/v614/ALKE-v614-hr-widget-recovery-personal-signed.apk" | sha256sum -c -
          echo "$SIGNED_SHA256  ALKE-v614-hr-widget-recovery-personal-signed.apk" > "$RUNNER_TEMP/v614/ALKE-v614-hr-widget-recovery-personal-signed.apk.sha256"

      - name: Validate original v613 compatible signer, app package and build number
        shell: bash
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/v614/ALKE-v614-hr-widget-recovery-personal-signed.apk"
          signer="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          test -x "$signer" && test -x "$aapt"
          "$signer" verify --min-sdk-version 26 --verbose --print-certs "$apk" > "$RUNNER_TEMP/v614/signature.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/v614/signature.txt"
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' "$RUNNER_TEMP/v614/signature.txt"
          grep -Fq 'certificate SHA-256 digest: f34c6210ef774d588a426a784a09bb452f01b6c5f18bec64b03e209a0420e877' "$RUNNER_TEMP/v614/signature.txt"
          "$aapt" dump badging "$apk" | head -1 | tee "$RUNNER_TEMP/v614/badging.txt"
          grep -Fq "name='com.otidotid.alke.personal.debug'" "$RUNNER_TEMP/v614/badging.txt"
          grep -Fq "versionCode='614'" "$RUNNER_TEMP/v614/badging.txt"
          unzip -t "$apk" >/dev/null
          mkdir -p "$RUNNER_TEMP/v614/previous"
          gh release download v1.0.0-alpha.22.23-premium-live-widgets.613 --repo "$GITHUB_REPOSITORY" --pattern ALKE-v613-premium-live-widgets-personal-signed.apk --dir "$RUNNER_TEMP/v614/previous"
          "$signer" verify --min-sdk-version 26 --print-certs "$RUNNER_TEMP/v614/previous/ALKE-v613-premium-live-widgets-personal-signed.apk" > "$RUNNER_TEMP/v614/previous-cert.txt"
          previous_cert="$(sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/v614/previous-cert.txt" | head -1)"
          new_cert="$(sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/v614/signature.txt" | head -1)"
          test -n "$previous_cert" && test "$new_cert" = "$previous_cert"

      - name: Publish signed ALKE v614 GitHub prerelease for owner review
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/v614/RELEASE_NOTES.md" <<'NOTES'
          # ALKE v614 — HR Widget Recovery (Personal signed)
          
          **Signed with the original ALKE Personal update certificate, compatible with v613.**
          Update directly over v613. DO NOT uninstall, clear data or reset storage.
          
          - Fix the HR Widget selecting hours-old Glance preferences ahead of newer HR readings
            from the persisted snapshot. Freshest valid timestamp wins; never invent LIVE status.
          - Preserve a useful HR headline and explicit no-recent-trace message when the
            three-hour chart has no points, instead of a nearly empty timestamp-only card.
          - Reduce binder-heavy HR chart refreshes from potential 1Hz to a bounded 3–5s cadence;
            the chart remains a minute-bucketed historical series.
          - Improve the HR widget's default 4x2 height so BPM, graph and status fit.
          - Keep the v613 Compact 2x2 and Daily 3x2 widgets unchanged.
          - No changes to stored data, BLE protocols, sensor algorithms, backups or sync.
          - Background LIVE readings still require an active BLE connection and Android foreground service.
          - Physical-launcher smoke test remains required before confirming this fixes a specific phone.
          
          Complete Personal CI SUCCESS run 45020175520, source SHA 86c287daf73dd0fbbca54843b5224ea5b4a9bcf3.
          Signed APK SHA-256: dc874fbf8405e9c7a505cb4f14012c4c06389471696135e8a1f3ca39aa6c4302.
          NOTES
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/v614/ALKE-v614-hr-widget-recovery-personal-signed.apk" "$RUNNER_TEMP/v614/ALKE-v614-hr-widget-recovery-personal-signed.apk.sha256" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "ALKE Alpha 22.24 v614 — HR Widget Recovery (Personal Signed)" --notes-file "$RUNNER_TEMP/v614/RELEASE_NOTES.md" --prerelease
          else
            gh release create "$RELEASE_TAG" "$RUNNER_TEMP/v614/ALKE-v614-hr-widget-recovery-personal-signed.apk" "$RUNNER_TEMP/v614/ALKE-v614-hr-widget-recovery-personal-signed.apk.sha256" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_COMMIT" --title "ALKE Alpha 22.24 v614 — HR Widget Recovery (Personal Signed)" --notes-file "$RUNNER_TEMP/v614/RELEASE_NOTES.md" --prerelease
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,url,assets --jq '{tag:.tagName,url:.url,assets:[.assets[].name]}'
