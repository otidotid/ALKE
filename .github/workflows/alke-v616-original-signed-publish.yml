name: ALKE v616 Owner-Certificate Personal Signed Release

on:
  push:
    branches: [alke/v616-vo2-pace-v2]
    paths: [.github/workflows/alke-v616-original-signed-publish.yml]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: alke-v616-owner-personal-signed
  cancel-in-progress: false

jobs:
  sign-and-publish:
    if: github.repository == 'otidotid/ALKE'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v1.0.0-alpha.22.26-vo2-pace.616
      VERIFIED_RUN: '45104501872'
      VERIFIED_HEAD: 9e6f84cb48ae8f45082c3e66a808128fc9c2434f
      EXCHANGE_BRANCH: alke/v616-vo2-pace-v2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require same source as validated v616 Personal tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only "$VERIFIED_HEAD" HEAD -- android | wc -l)" -eq 0
          for i in $(seq 1 240); do
            status="$(gh run view "$VERIFIED_RUN" --repo "$GITHUB_REPOSITORY" --json status --jq .status)"
            if [ "$status" = completed ]; then break; fi
            sleep 10
          done
          test "$(gh run view "$VERIFIED_RUN" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$VERIFIED_RUN" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = "$VERIFIED_HEAD"
          mkdir -p "$RUNNER_TEMP/v616/unsigned"
          gh run download "$VERIFIED_RUN" --repo "$GITHUB_REPOSITORY" --name ALKE-v616-Personal-Base-REQUIRES-ORIGINAL-SIGNER --dir "$RUNNER_TEMP/v616/unsigned"
          test -s "$RUNNER_TEMP/v616/unsigned/app-personal-debug.apk"
          aapt="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          "$aapt" dump badging "$RUNNER_TEMP/v616/unsigned/app-personal-debug.apk" | head -1 | tee "$RUNNER_TEMP/v616/badging.txt"
          grep -Fq "name='com.otidotid.alke.personal.debug'" "$RUNNER_TEMP/v616/badging.txt"
          grep -Fq "versionCode='616'" "$RUNNER_TEMP/v616/badging.txt"

      - name: Create short-lived certificate for in-run private credential delivery
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl req -x509 -newkey rsa:3072 -noenc -nodes -days 1 -subj "/CN=ALKE-v616-one-run-${GITHUB_RUN_ID}" \
            -keyout "$RUNNER_TEMP/v616/ephemeral.key" -out "$RUNNER_TEMP/v616/ephemeral.pem" >/dev/null 2>&1
          public="release-exchange/v616-${GITHUB_RUN_ID}-ephemeral.pem"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$public" \
            -f branch="$EXCHANGE_BRANCH" \
            -f message="chore(v616): ephemeral public certificate for isolated APK signing" \
            -f content="$(base64 -w0 "$RUNNER_TEMP/v616/ephemeral.pem")" >/dev/null
          echo "Ephemeral signing exchange ready; run id: $GITHUB_RUN_ID"

      - name: Receive sealed signing kit and create original-certificate signed APK
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private="release-exchange/v616-${GITHUB_RUN_ID}-sealed.cms.b64"
          ready=0
          for i in $(seq 1 240); do
            if gh api "repos/$GITHUB_REPOSITORY/contents/$private?ref=$EXCHANGE_BRANCH" --jq .content > "$RUNNER_TEMP/v616/exchange-file.b64" 2>/dev/null; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" -eq 1 || { echo "::error::No encrypted kit received for this run"; exit 1; }
          base64 -d "$RUNNER_TEMP/v616/exchange-file.b64" | base64 -d > "$RUNNER_TEMP/v616/sealed.cms"
          openssl cms -decrypt -binary -inform DER \
            -recip "$RUNNER_TEMP/v616/ephemeral.pem" \
            -inkey "$RUNNER_TEMP/v616/ephemeral.key" \
            -in "$RUNNER_TEMP/v616/sealed.cms" -out "$RUNNER_TEMP/v616/kit.tar"
          mkdir -p "$RUNNER_TEMP/v616/kit" "$RUNNER_TEMP/v616/final"
          tar -xf "$RUNNER_TEMP/v616/kit.tar" -C "$RUNNER_TEMP/v616/kit" --no-same-owner
          test -s "$RUNNER_TEMP/v616/kit/ALKE-personal-update-key.p12"
          test -s "$RUNNER_TEMP/v616/kit/signing-pass.txt"
          signer="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          apk="$RUNNER_TEMP/v616/final/ALKE-v616-vo2-pace-personal-signed.apk"
          "$signer" sign \
            --ks "$RUNNER_TEMP/v616/kit/ALKE-personal-update-key.p12" \
            --ks-type PKCS12 --ks-key-alias alke-private \
            --ks-pass "file:$RUNNER_TEMP/v616/kit/signing-pass.txt" \
            --key-pass "file:$RUNNER_TEMP/v616/kit/signing-pass.txt" \
            --min-sdk-version 26 \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out "$apk" "$RUNNER_TEMP/v616/unsigned/app-personal-debug.apk"
          "$signer" verify --min-sdk-version 26 --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/v616/signer-report.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/v616/signer-report.txt"
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' "$RUNNER_TEMP/v616/signer-report.txt"
          grep -Fq 'certificate SHA-256 digest: f34c6210ef774d588a426a784a09bb452f01b6c5f18bec64b03e209a0420e877' "$RUNNER_TEMP/v616/signer-report.txt"
          unzip -t "$apk" >/dev/null
          mkdir -p "$RUNNER_TEMP/v616/previous"
          gh release download v1.0.0-alpha.22.25-hr-widget-canvas.615 --repo "$GITHUB_REPOSITORY" \
            --pattern 'ALKE-v615-hr-widget-canvas-personal-signed.apk' --dir "$RUNNER_TEMP/v616/previous"
          "$signer" verify --min-sdk-version 26 --print-certs "$RUNNER_TEMP/v616/previous/ALKE-v615-hr-widget-canvas-personal-signed.apk" > "$RUNNER_TEMP/v616/previous-signer.txt"
          old_cert="$(sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/v616/previous-signer.txt" | head -1)"
          new_cert="$(sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/v616/signer-report.txt" | head -1)"
          test -n "$old_cert" && test "$old_cert" = "$new_cert"
          aapt="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          "$aapt" dump badging "$apk" | head -1 | tee "$RUNNER_TEMP/v616/signed-badging.txt"
          grep -Fq "name='com.otidotid.alke.personal.debug'" "$RUNNER_TEMP/v616/signed-badging.txt"
          grep -Fq "versionCode='616'" "$RUNNER_TEMP/v616/signed-badging.txt"
          (cd "$RUNNER_TEMP/v616/final"; sha256sum ALKE-v616-vo2-pace-personal-signed.apk > ALKE-v616-vo2-pace-personal-signed.apk.sha256)
          rm -rf "$RUNNER_TEMP/v616/kit" "$RUNNER_TEMP/v616/kit.tar" "$RUNNER_TEMP/v616/sealed.cms" "$RUNNER_TEMP/v616/ephemeral.key" "$RUNNER_TEMP/v616/exchange-file.b64"

      - name: Publish verified original-certificate Personal APK
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/v616/notes.md" <<'NOTES'
          # ALKE v616 — VO2 Max v2 and Source-Agnostic Workout Pace

          **Verified Personal signed upgrade from v615.** Original certificate F34C retained.
          Package `com.otidotid.alke.personal.debug`, versionCode 616. Update over existing
          ALKE Personal without uninstalling or clearing data.

          - Average pace derived from recorded workout distance and duration for ALKE recordings,
            Zepp / Health Connect and other existing import sources. Shows in workout details.
          - Explicitly consented Health Connect workout HR read; historical imported sessions
            can be enriched without erasing original values.
          - VO2 Max keeps the original Nes/Uth baseline (52.5 stays as calculated) until
            3 high-quality running sessions exist. Exercise-based adjustment is capped at
            plus/minus 0.5 ml/kg/min. Fitness Age unchanged.
          - No migration or destructive cleanup; preserves existing history and other algorithms.

          This is a wellness estimator, not lab-measured VO2 max. On-device smoke testing
          of Health Connect permissions, imported workout pace, and values is still required.
          NOTES
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "$RUNNER_TEMP/v616/final/ALKE-v616-vo2-pace-personal-signed.apk" \
              "$RUNNER_TEMP/v616/final/ALKE-v616-vo2-pace-personal-signed.apk.sha256" \
              --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title 'ALKE v616 — VO2 Max Pace (Original Personal Signed)' --notes-file "$RUNNER_TEMP/v616/notes.md" --prerelease
          else
            gh release create "$RELEASE_TAG" \
              "$RUNNER_TEMP/v616/final/ALKE-v616-vo2-pace-personal-signed.apk" \
              "$RUNNER_TEMP/v616/final/ALKE-v616-vo2-pace-personal-signed.apk.sha256" \
              --repo "$GITHUB_REPOSITORY" --target "$VERIFIED_HEAD" \
              --title 'ALKE v616 — VO2 Max Pace (Original Personal Signed)' --notes-file "$RUNNER_TEMP/v616/notes.md" --prerelease
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,url,assets \
            --jq '{tag:.tagName,url:.url,files:[.assets[].name]}'

      - name: Remove one-run encrypted signing exchange
        if: always()
        shell: bash
        run: |
          for file in "release-exchange/v616-${GITHUB_RUN_ID}-sealed.cms.b64" "release-exchange/v616-${GITHUB_RUN_ID}-ephemeral.pem"; do
            sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$file?ref=$EXCHANGE_BRANCH" --jq .sha 2>/dev/null || true)"
            if [ -n "$sha" ]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$file" \
                -f branch="$EXCHANGE_BRANCH" -f sha="$sha" \
                -f message='chore(v616): remove one-run encrypted signing exchange' >/dev/null || true
            fi
          done
