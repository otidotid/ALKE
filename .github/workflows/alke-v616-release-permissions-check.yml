name: ALKE v616 - GitHub Release Permission Check
on:
  push:
    branches: [alke/v616-vo2-pace-v2]
    paths:
      - .github/workflows/alke-v616-release-permissions-check.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  draft-release:
    if: github.repository == 'otidotid/ALKE'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v1.0.0-alpha.22.26-vo2-pace.616
      SOURCE: 9e6f84cb48ae8f45082c3e66a808128fc9c2434f
    steps:
      - name: Create draft GitHub release (does not publish)
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' >/dev/null 2>&1; then
            echo "Release already exists, skipping permission check"
            exit 0
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" -f target_commitish="$SOURCE" \
            -f name="ALKE v616 — VO2 Max Pace (Personal Signed)" \
            -f body="Build and installation validated; awaiting upload of matching owner-signed APK." \
            -F draft=true -F prerelease=true --jq '{id: .id, draft: .draft, tag: .tag_name}'
