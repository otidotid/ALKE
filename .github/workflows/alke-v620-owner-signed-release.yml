name: ALKE v620 Verified Personal F34C Automatic Release

on:
  push:
    branches: [alke/v620-publish-exchange]
    paths: [.github/workflows/alke-v620-owner-signed-release.yml]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: alke-v620-owner-personal-signed
  cancel-in-progress: false

jobs:
  sign-and-publish:
    if: github.repository == 'otidotid/ALKE'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v1.0.0-alpha.22.30-wearable-header.620
      VERIFIED_RUN: '45369325691'
      VERIFIED_HEAD: fcd3c629158f41a627aa5ec2df5b2b21b4cffde8
      RELEASE_SOURCE: 587404c7fad7b1cddc83b67f5562005a947cdf49
      EXCHANGE_BRANCH: alke/v620-publish-exchange
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require same source as validated v620 Personal tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only "$VERIFIED_HEAD" HEAD -- android | wc -l)" -eq 0
          for i in $(seq 1 240); do
            status="$(gh run view "$VERIFIED_RUN" --repo "$GITHUB_REPOSITORY" --json status --jq .status)"
            if [ "$status" = completed ]; then break; fi
            sleep 10
          done
          test "$(gh run view "$VERIFIED_RUN" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$VERIFIED_RUN" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = "$VERIFIED_HEAD"
          mkdir -p "$RUNNER_TEMP/v620/unsigned"
          gh run download "$VERIFIED_RUN" --repo "$GITHUB_REPOSITORY" --name ALKE-Personal-Validated-Unsigned --dir "$RUNNER_TEMP/v620/unsigned"
          test -s "$RUNNER_TEMP/v620/unsigned/ALKE-personal-v620-unsigned.apk"
          aapt="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          "$aapt" dump badging "$RUNNER_TEMP/v620/unsigned/ALKE-personal-v620-unsigned.apk" > "$RUNNER_TEMP/v620/badging.txt"
          grep -Fq "name='com.otidotid.alke.personal.debug'" "$RUNNER_TEMP/v620/badging.txt"
          grep -Fq "versionCode='620'" "$RUNNER_TEMP/v620/badging.txt"

      - name: Create short-lived certificate for in-run private credential delivery
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl req -x509 -newkey rsa:3072 -noenc -nodes -days 1 -subj "/CN=ALKE-v620-one-run-${GITHUB_RUN_ID}" \
            -keyout "$RUNNER_TEMP/v620/ephemeral.key" -out "$RUNNER_TEMP/v620/ephemeral.pem" >/dev/null 2>&1
          public="release-exchange/v620-${GITHUB_RUN_ID}-ephemeral.pem"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$public" \
            -f branch="$EXCHANGE_BRANCH" \
            -f message="chore(v620): ephemeral public certificate for isolated APK signing" \
            -f content="$(base64 -w0 "$RUNNER_TEMP/v620/ephemeral.pem")" >/dev/null
          echo "Ephemeral signing exchange ready; run id: $GITHUB_RUN_ID"

      - name: Receive sealed signing kit and create original-certificate signed APK
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private="release-exchange/v620-${GITHUB_RUN_ID}-sealed.cms.b64"
          ready=0
          for i in $(seq 1 240); do
            if gh api "repos/$GITHUB_REPOSITORY/contents/$private?ref=$EXCHANGE_BRANCH" --jq .content > "$RUNNER_TEMP/v620/exchange-file.b64" 2>/dev/null; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" -eq 1 || { echo "::error::No encrypted kit received for this run"; exit 1; }
          base64 -d "$RUNNER_TEMP/v620/exchange-file.b64" | base64 -d > "$RUNNER_TEMP/v620/sealed.cms"
          openssl cms -decrypt -binary -inform DER \
            -recip "$RUNNER_TEMP/v620/ephemeral.pem" \
            -inkey "$RUNNER_TEMP/v620/ephemeral.key" \
            -in "$RUNNER_TEMP/v620/sealed.cms" -out "$RUNNER_TEMP/v620/kit.tar"
          mkdir -p "$RUNNER_TEMP/v620/kit" "$RUNNER_TEMP/v620/final"
          tar -xf "$RUNNER_TEMP/v620/kit.tar" -C "$RUNNER_TEMP/v620/kit" --no-same-owner
          test -s "$RUNNER_TEMP/v620/kit/ALKE-personal-update-key.p12"
          test -s "$RUNNER_TEMP/v620/kit/signing-pass.txt"
          # apksigner consumes file: passwords as streams; a second separate file
          # prevents the key-password read from hitting EOF after the store read.
          cp "$RUNNER_TEMP/v620/kit/signing-pass.txt" "$RUNNER_TEMP/v620/kit/signing-key-pass.txt"
          chmod 600 "$RUNNER_TEMP/v620/kit/signing-key-pass.txt"
          signer="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          apk="$RUNNER_TEMP/v620/final/ALKE-v620-Premium-Header-F34C.apk"
          "$signer" sign \
            --ks "$RUNNER_TEMP/v620/kit/ALKE-personal-update-key.p12" \
            --ks-type PKCS12 --ks-key-alias alke-private \
            --ks-pass "file:$RUNNER_TEMP/v620/kit/signing-pass.txt" \
            --key-pass "file:$RUNNER_TEMP/v620/kit/signing-key-pass.txt" \
            --min-sdk-version 26 \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out "$apk" "$RUNNER_TEMP/v620/unsigned/ALKE-personal-v620-unsigned.apk"
          "$signer" verify --min-sdk-version 26 --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/v620/signer-report.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/v620/signer-report.txt"
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' "$RUNNER_TEMP/v620/signer-report.txt"
          grep -Fq 'certificate SHA-256 digest: f34c6210ef774d588a426a784a09bb452f01b6c5f18bec64b03e209a0420e877' "$RUNNER_TEMP/v620/signer-report.txt"
          unzip -t "$apk" >/dev/null
          mkdir -p "$RUNNER_TEMP/v620/previous"
          gh release download v1.0.0-alpha.22.29-quality-hypopnea.619 --repo "$GITHUB_REPOSITORY" \
            --pattern 'ALKE-v620-Hypopnea-Quality-F34C.apk' --dir "$RUNNER_TEMP/v620/previous"
          "$signer" verify --min-sdk-version 26 --print-certs "$RUNNER_TEMP/v620/previous/ALKE-v620-Hypopnea-Quality-F34C.apk" > "$RUNNER_TEMP/v620/previous-signer.txt"
          old_cert="$(sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/v620/previous-signer.txt" | head -1)"
          new_cert="$(sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/v620/signer-report.txt" | head -1)"
          test -n "$old_cert" && test "$old_cert" = "$new_cert"
          aapt="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          "$aapt" dump badging "$apk" > "$RUNNER_TEMP/v620/signed-badging.txt"
          grep -Fq "name='com.otidotid.alke.personal.debug'" "$RUNNER_TEMP/v620/signed-badging.txt"
          grep -Fq "versionCode='619'" "$RUNNER_TEMP/v620/signed-badging.txt"
          (cd "$RUNNER_TEMP/v620/final"; sha256sum ALKE-v620-Premium-Header-F34C.apk > ALKE-v620-Premium-Header-F34C.apk.sha256)
          rm -rf "$RUNNER_TEMP/v620/kit" "$RUNNER_TEMP/v620/kit.tar" "$RUNNER_TEMP/v620/sealed.cms" "$RUNNER_TEMP/v620/ephemeral.key" "$RUNNER_TEMP/v620/exchange-file.b64"

      - name: Publish verified original-certificate Personal APK
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/v620/notes.md" <<'NOTES'
          # ALKE v620 — Premium Global Header

          Original ALKE Personal F34C certificate retained and verified against
          ALKE v619. Package com.otidotid.alke.personal.debug, versionCode 620.
          Install directly over v619 without uninstalling or clearing local
          health, sleep, workout, backup, or fitness history.

          - New minimal cyan ALKE 'A' mark with white wordmark in the one global
            header shared by Today, Progress, Insight, Stress & Breathe, and Me.
          - WHOOP-inspired generic wearable band outline + current connected
            device battery percentage in a compact dark rounded chip.
          - Unavailable/disconnected battery remains unreported (dash), never
            a stale percentage; low/charging indicators reflect live state.
          - Existing BLE/history-sync glow and rotation remain attached to the
            new ALKE logo, and the Sync & Notifications hub is preserved.
          - No new battery-tap shortcut; navigation and Today metrics unchanged.
          - No health algorithm changes, no Room/database migrations and
            no changes to the historic v619 Hypopnea logic.

          Regression contract, full Personal JVM tests, build and signature
          integrity checks passed. Device smoke testing remains required.
          NOTES
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "$RUNNER_TEMP/v620/final/ALKE-v620-Premium-Header-F34C.apk" \
              "$RUNNER_TEMP/v620/final/ALKE-v620-Premium-Header-F34C.apk.sha256" \
              --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title 'ALKE v620 — Main Source & Morning Hypopnea Fix (Personal F34C)' --notes-file "$RUNNER_TEMP/v620/notes.md" --prerelease
          else
            gh release create "$RELEASE_TAG" \
              "$RUNNER_TEMP/v620/final/ALKE-v620-Premium-Header-F34C.apk" \
              "$RUNNER_TEMP/v620/final/ALKE-v620-Premium-Header-F34C.apk.sha256" \
              --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SOURCE" \
              --title 'ALKE v620 — Main Source & Morning Hypopnea Fix (Personal F34C)' --notes-file "$RUNNER_TEMP/v620/notes.md" --prerelease
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,url,assets \
            --jq '{tag:.tagName,url:.url,files:[.assets[].name]}'

      - name: Remove one-run encrypted signing exchange
        if: always()
        shell: bash
        run: |
          # Best-effort runner-side removal even after a failed signing command.
          rm -rf "$RUNNER_TEMP/v620/kit" "$RUNNER_TEMP/v620/kit.tar" "$RUNNER_TEMP/v620/sealed.cms" "$RUNNER_TEMP/v620/ephemeral.key" || true
          for file in "release-exchange/v620-${GITHUB_RUN_ID}-sealed.cms.b64" "release-exchange/v620-${GITHUB_RUN_ID}-ephemeral.pem"; do
            sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$file?ref=$EXCHANGE_BRANCH" --jq .sha 2>/dev/null || true)"
            if [ -n "$sha" ]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$file" \
                -f branch="$EXCHANGE_BRANCH" -f sha="$sha" \
                -f message='chore(v620): remove one-run encrypted signing exchange' >/dev/null || true
            fi
          done
