name: ALKE v620 - Premium Global Header Review APK

on:
  push:
    branches: [alke/v620-wearable-header-premium]
  # Historical v620 review; subsequent versions use Personal Quality Gate.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alke-v620-premium-header-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Check v620 logo, battery, and sync contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 620' android/app/build.gradle.kts
          grep -Fq 'versionName = "1.0.0-alpha.22.30-wearable-header"' android/app/build.gradle.kts
          test -s android/app/src/main/res/drawable/alke_header_minimal_mark.xml
          test -s android/app/src/main/java/com/otidotid/alke/ui/AlkeBatteryGlyph.kt
          python3 - <<'PY'
          from pathlib import Path
          s = Path("android/app/src/main/java/com/otidotid/alke/ui/AlkeExperience.kt").read_text()
          h = s.split("private fun AlkeHeader(", 1)[1].split("private fun AlkeHeading(", 1)[0]
          root = Path("android/app/src/main/java/com/otidotid/alke/ui/AppRoot.kt").read_text()
          assert "AlkeGlobalHeader(" in root and "topBar = {" in root
          assert "R.drawable.alke_header_minimal_mark" in h
          assert "AlkeBatteryGlyph(" in h
          assert "R.drawable.alke_header_wearable_outline" not in h
          glyph = Path("android/app/src/main/java/com/otidotid/alke/ui/AlkeBatteryGlyph.kt").read_text()
          assert "0xFF26DEEB" in glyph and "battery <= 20" in glyph and "24f*x*fraction" in glyph
          res = Path("android/app/src/main/res")
          for n in ["alke_header_minimal_mark", "alke_brand_mark", "ic_launcher_foreground", "ic_launcher_monochrome", "ic_launcher_metal", "ic_launcher_metal_navy"]:
              v = (res / "drawable" / (n + ".xml")).read_text()
              assert "M18,78 L48,21" in v and "M56,47 L80,78" in v
          assert "Your Strength and Rest Companion" in (res / "values/alke_brand.xml").read_text()
          assert "if (syncing)" in h and "alke-global-sync" in h
          assert "showSyncHub = true" in h
          assert "if (live.connected)" in h and "live.batteryPct" in h
          assert "ringBattery" in h and "stateDescription" in h
          assert "persistent-battery-breathe" not in h
          assert '"SYNCING DEVICE"' not in h
          assert '"THE INTELLIGENCE WITHIN"' not in h
          assert 'AlkeHeader(' in s
          assert "AlkePremiumHeaderContractTest" in Path("android/app/src/test/java/com/otidotid/alke/ui/AlkePremiumHeaderContractTest.kt").read_text()
          PY
      - name: Resolve Gradle/KSP dependencies with retries
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          for attempt in 1 2 3 4; do
            if ./gradlew -PstagingRelease --no-daemon help; then exit 0; fi
            if [ "$attempt" -eq 4 ]; then
              echo "::error::KSP/Gradle dependency resolution failed after four attempts"
              exit 1
            fi
            sleep $((attempt * 8))
          done
      - name: Full Personal tests and APK builds
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew -PstagingRelease --no-daemon :app:testPersonalDebugUnitTest :app:assemblePersonalRelease :app:assemblePersonalDebug
      - name: Validate staging signature and Personal signing base
        shell: bash
        run: |
          set -euo pipefail
          staging=android/app/build/outputs/apk/personal/release/app-personal-release.apk
          base=android/app/build/outputs/apk/personal/debug/app-personal-debug.apk
          test -s "$staging" && test -s "$base"
          aapt="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$staging" > "$RUNNER_TEMP/staging-badging.txt"
          "$aapt" dump badging "$base" > "$RUNNER_TEMP/personal-badging.txt"
          grep -Fq "name='com.otidotid.alke.personal.staging'" "$RUNNER_TEMP/staging-badging.txt"
          grep -Fq "name='com.otidotid.alke.personal.debug'" "$RUNNER_TEMP/personal-badging.txt"
          grep -Fq "versionCode='620'" "$RUNNER_TEMP/staging-badging.txt"
          grep -Fq "versionCode='620'" "$RUNNER_TEMP/personal-badging.txt"
          "$signer" verify --min-sdk-version 26 --verbose "$staging" > "$RUNNER_TEMP/signature.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/signature.txt"
          unzip -t "$staging" >/dev/null
          unzip -t "$base" >/dev/null
          ! unzip -Z1 "$staging" | grep -Eq '(\.alkebak$|\.noopbak$|\.keystore$|\.jks$|\.p12$|local\.properties$)'
          ! unzip -Z1 "$base" | grep -Eq '(\.alkebak$|\.noopbak$|\.keystore$|\.jks$|\.p12$|local\.properties$)'
          mkdir -p release-output
          cp "$staging" release-output/ALKE-v620-PremiumHeader-STAGING.apk
          (cd release-output && sha256sum ALKE-v620-PremiumHeader-STAGING.apk > ALKE-v620-PremiumHeader-STAGING.apk.sha256)
      - name: Upload side-by-side staging APK
        uses: actions/upload-artifact@v4
        with:
          name: ALKE-v620-PremiumHeader-STAGING
          path: release-output/
          if-no-files-found: error
          retention-days: 30
      - name: Upload Personal base for original F34C owner signing
        uses: actions/upload-artifact@v4
        with:
          name: ALKE-v620-PersonalBase-REQUIRES-ORIGINAL-SIGNER
          path: android/app/build/outputs/apk/personal/debug/app-personal-debug.apk
          if-no-files-found: error
          retention-days: 30
