name: ALKE v625 Independent Device Smoke
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alke-device-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emulator-smoke:
    if: github.head_ref == 'alke/v625-premium-redesign' || github.ref_name == 'alke/v625-premium-redesign'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build synthetic demo (debug key only; never F34C)
        working-directory: android
        shell: bash
        env:
          ALKE_CLOUD_COACH_URL: https://127.0.0.1:9
          ALKE_GOOGLE_WEB_CLIENT_ID: ""
        run: |
          set -euo pipefail
          chmod +x gradlew
          for attempt in 1 2 3 4; do
            if ./gradlew -PstagingRelease --no-daemon help; then break; fi
            test "$attempt" -lt 4
            sleep $((attempt * 8))
          done
          ./gradlew -PstagingRelease --no-daemon :app:assembleDemoDebug
      - name: Prepare isolated Android 34 emulator
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$sdkmanager" && test -x "$sdkmanager"
          avdmanager="$(dirname "$sdkmanager")/avdmanager"
          test -x "$avdmanager"
          "$sdkmanager" --sdk_root="$sdk_root" --install "platform-tools" "emulator" "system-images;android-34;google_apis;x86_64"
          export PATH="$sdk_root/platform-tools:$sdk_root/emulator:$PATH"
          "$avdmanager" create avd --force --name alke625 --package "system-images;android-34;google_apis;x86_64" --device pixel_6 <<< no
          "$sdk_root/emulator/emulator" -avd alke625 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none -camera-front none > "$RUNNER_TEMP/alke-emulator.log" 2>&1 &
          timeout 300 adb -s emulator-5554 wait-for-device
          timeout 300 bash -c 'until [[ "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d "\r")" == 1 ]]; do sleep 3; done'
          adb -s emulator-5554 shell input keyevent 82
          adb -s emulator-5554 shell wm size 1080x2400
          adb -s emulator-5554 shell wm density 420
          adb -s emulator-5554 shell svc wifi disable
          adb -s emulator-5554 shell svc data disable
          adb -s emulator-5554 install -g android/app/build/outputs/apk/demo/debug/app-demo-debug.apk
      - name: Exercise module navigation, capture screenshots, crash logs and frames
        run: python3 android/tools/v625_device_smoke.py
      - name: Upload independent evidence (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ALKE-v625-Device-Smoke-Evidence
          path: |
            smoke-evidence/
            ${{ runner.temp }}/alke-emulator.log
          if-no-files-found: warn
          retention-days: 14
