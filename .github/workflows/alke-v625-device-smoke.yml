name: ALKE v625 Independent Device Smoke
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alke-device-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emulator-smoke:
    if: github.head_ref == 'alke/v625-premium-redesign' || github.ref_name == 'alke/v625-premium-redesign'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build synthetic demo (debug key only; never F34C)
        working-directory: android
        shell: bash
        env:
          ALKE_CLOUD_COACH_URL: https://127.0.0.1:9
          ALKE_GOOGLE_WEB_CLIENT_ID: ""
        run: |
          set -euo pipefail
          chmod +x gradlew
          for attempt in 1 2 3 4; do
            if ./gradlew -PstagingRelease --no-daemon help; then break; fi
            test "$attempt" -lt 4
            sleep $((attempt * 8))
          done
          ./gradlew -PstagingRelease --no-daemon :app:assembleDemoDebug
      - name: Enable KVM for isolated Android 34 emulator
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod a+rw /dev/kvm
      - name: Boot isolated emulator and exercise navigation
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: alke625
          emulator-port: 5554
          emulator-boot-timeout: 600
          disable-linux-hw-accel: false
          disable-animations: false
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          script: |
            set -eu
            mkdir -p smoke-evidence
            adb devices -l | tee smoke-evidence/adb-devices.txt
            adb -s emulator-5554 shell input keyevent 82
            adb -s emulator-5554 shell wm size 1080x2400
            adb -s emulator-5554 shell wm density 420
            adb -s emulator-5554 shell svc wifi disable
            adb -s emulator-5554 shell svc data disable
            adb -s emulator-5554 install -g android/app/build/outputs/apk/demo/debug/app-demo-debug.apk
            ALKE_SMOKE_SERIAL=emulator-5554 python3 android/tools/v625_device_smoke.py
      - name: Upload independent evidence (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ALKE-v625-Device-Smoke-Evidence
          path: |
            smoke-evidence/
          if-no-files-found: warn
          retention-days: 14
