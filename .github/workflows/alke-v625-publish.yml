name: ALKE v625 Publish Verified Personal F34C
on:
  push:
    branches: [alke/v625-offline-release]
    paths:
      - .github/workflows/alke-v625-publish.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: alke-v625-personal-release
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SIGNATURE_BLOCK: ''
      SOURCE_SHA: b71115edfabbf939f628fa205262c134e2a0569b
      MERGE_SHA: 0c65fd81bf7b17e701b5bdd289b5c9e201624dbc
      SIGNED_SHA: ee57cc91885afe32cbfa0b372bef896ceb423ed85a9c17255a8813e1edf298a8
      TAG: v1.0.0-alpha.22.33-premium-redesign.625
    steps:
      - name: Verify source and successful quality gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/45796649911 --jq .conclusion)" = success
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/45796649911 --jq .head_sha)" = "$SOURCE_SHA"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/45806160727 --jq .conclusion)" = success
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/45806160727 --jq .head_sha)" = "$MERGE_SHA"
          test "$(gh api repos/$GITHUB_REPOSITORY/git/commits/$SOURCE_SHA --jq .tree.sha)" = "$(gh api repos/$GITHUB_REPOSITORY/git/commits/$MERGE_SHA --jq .tree.sha)"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/15105886848 --jq .digest)" = "sha256:0ff8915bc3c975039609f2ad4fd5e536ffcd38111cdae2fee214c38165c73e88"
          gh run download 45796649911 --repo "$GITHUB_REPOSITORY" --name ALKE-Personal-Validated-Unsigned --dir input
      - name: Reconstruct exact offline-signed APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          python - <<'PY'
          import base64, hashlib, os, pathlib, struct, zlib, zipfile
          source = pathlib.Path('input/ALKE-personal-v625-unsigned.apk').read_bytes()
          assert hashlib.sha256(source).hexdigest() == 'fbe4089436bbfc4114bd7f2f76eecaf16fb9cf50b6080311c1e9ca21b8af92e1'
          compressed = base64.b64decode(os.environ['SIGNATURE_BLOCK'], validate=True)
          assert hashlib.sha256(compressed).hexdigest() == '971500aefc104fae73d160d431601ab3e2478871c2b08ae9d47a4e58060354a4'
          block = zlib.decompress(compressed)
          assert len(block) == 9860
          tail = bytearray(source[34707836:])
          eocd = tail.rfind(b'PK\x05\x06')
          assert eocd >= 0
          struct.pack_into('<I', tail, eocd + 16, 34713600)
          apk = source[:34703740] + block + tail
          digest = hashlib.sha256(apk).hexdigest()
          assert digest == os.environ['SIGNED_SHA']
          out = pathlib.Path('release-output/ALKE-v625-F34C.apk')
          out.write_bytes(apk)
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
              assert not any(n.lower().endswith(('.p12','.jks','.keystore','.alkebak','.noopbak','local.properties')) for n in z.namelist())
          out.with_suffix('.apk.sha256').write_text(digest+'  '+out.name+'\n', encoding='ascii')
          PY
      - name: Independently verify APK package and original certificate
        shell: bash
        run: |
          set -euo pipefail
          apk=release-output/ALKE-v625-F34C.apk
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          "$signer" verify --min-sdk-version 26 --verbose --print-certs "$apk" > signature.txt
          cat signature.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' signature.txt
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' signature.txt
          grep -Fq 'certificate SHA-256 digest: f34c6210ef774d588a426a784a09bb452f01b6c5f18bec64b03e209a0420e877' signature.txt
          "$aapt" dump badging "$apk" > badging.txt
          grep -Fq "package: name='com.otidotid.alke.personal.debug' versionCode='625'" badging.txt
          (cd release-output && sha256sum -c ALKE-v625-F34C.apk.sha256)
      - name: Publish signed ALKE v625 GitHub release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing overwrite"
            exit 1
          fi
          gh release create "$TAG" release-output/ALKE-v625-F34C.apk release-output/ALKE-v625-F34C.apk.sha256 --repo "$GITHUB_REPOSITORY" --target "$MERGE_SHA" --title "ALKE v625 — Premium Redesign (Personal F34C)" --prerelease --notes "Approved premium redesign, Me shortcut icons, retained Today Hypopnea and Sleep Breathing Quality, protected HR graph and All Sessions. Personal quality gates passed before and after merge. Original F34C certificate verified (v2/v3). SHA-256 included. Direct update; do not uninstall existing ALKE. Manual demo smoke accepted; emulator skipped. No signing key or password uploaded."
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,url,assets --jq '{tag:.tagName,url:.url,assets:[.assets[].name]}'
